name: Scrape Tashkent events

on:
  schedule:
    # Every 3 hours (8x/day), offset 17 minutes past to avoid GitHub's documented
    # top-of-hour congestion window. This data only meaningfully changes once a
    # day, so we don't need */30 -- 8 chances/day is still plenty for GitHub's
    # unreliable schedule trigger to succeed at least a couple of times, while
    # cutting request volume to afisha.uz/iticket.uz by ~85% vs every 30 min.
    - cron: '17 */3 * * *'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python deps
        run: pip install -r scripts/requirements.txt

      - name: Install Playwright browser
        run: python -m playwright install --with-deps chromium

      - name: Run scraper
        run: python scripts/scrape_events.py > scripts/last-run-log.txt 2>&1 || echo "SCRAPER_FAILED_SEE_LOG" >> scripts/last-run-log.txt
        continue-on-error: true

      - name: Commit results and log
        if: always()
        run: |
          git config user.name "events-bot"
          git config user.email "actions@github.com"
          git add data/events-tashkent.json scripts/last-run-log.txt scripts/debug-*.html || true
          git diff --cached --quiet && echo "No changes to commit" || git commit -m "Auto-update Tashkent events [skip ci]"
          git pull --rebase --autostash origin main || true
          git push
