name: Scrape Tashkent events

on:
  schedule:
    # Every 30 minutes, matching the other scrapers -- NOT because we need
    # data every 30 min (this data only meaningfully changes once a day), but
    # because a once-daily cron slot ('0 19 * * *') never once fired
    # successfully: GitHub's schedule trigger is documented to be unreliable,
    # especially exactly on the hour, and with only 1-2 chances a day both got
    # silently skipped. The other scrapers on this repo use */30 and have
    # fired successfully many times -- more opportunities per day means the
    # same unreliable trigger actually succeeds at least a few times.
    - cron: '*/30 * * * *'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python deps
        run: pip install -r scripts/requirements.txt

      - name: Install Playwright browser
        run: python -m playwright install --with-deps chromium

      - name: Run scraper
        run: python scripts/scrape_events.py > scripts/last-run-log.txt 2>&1 || echo "SCRAPER_FAILED_SEE_LOG" >> scripts/last-run-log.txt
        continue-on-error: true

      - name: Commit results and log
        if: always()
        run: |
          git config user.name "events-bot"
          git config user.email "actions@github.com"
          git add data/events-tashkent.json scripts/last-run-log.txt scripts/debug-*.html || true
          git diff --cached --quiet && echo "No changes to commit" || git commit -m "Auto-update Tashkent events [skip ci]"
          git push
