name: Fetch UFC events (daily, Wikipedia)

on:
  schedule:
    - cron: '27 3 * * *'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python deps
        run: pip install requests beautifulsoup4

      - name: Run scraper
        run: python scripts/scrape_ufc.py > scripts/ufc-fetch-log.txt 2>&1 || echo "FETCH_FAILED_SEE_LOG" >> scripts/ufc-fetch-log.txt

      - name: Commit results and log
        if: always()
        run: |
          git config user.name "ufc-bot"
          git config user.email "actions@github.com"
          git add data/ufc-live.json scripts/ufc-fetch-log.txt scripts/debug-ufc-wiki.html || true
          git diff --cached --quiet && echo "No changes to commit" || git commit -m "Auto-update UFC events data [skip ci]"
          git push
