name: Scrape goal.com results (Arsenal + all major leagues)

on:
  schedule:
    # Every 30 minutes -- catches results well within 120 minutes of kickoff
    # for every league, not just Arsenal.
    - cron: '*/30 * * * *'
  workflow_dispatch: {}

permissions:
  contents: write
  actions: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python deps
        run: pip install requests beautifulsoup4

      - name: Run scraper
        run: python scripts/scrape_goal_results.py > scripts/goal-last-run-log.txt 2>&1 || echo "SCRAPER_FAILED_SEE_LOG" >> scripts/goal-last-run-log.txt
        continue-on-error: true

      - name: Commit results and log
        if: always()
        run: |
          git config user.name "goal-results-bot"
          git config user.email "actions@github.com"
          git add data/goal-results.json scripts/goal-last-run-log.txt scripts/debug-goal-*.html || true
          git diff --cached --quiet && echo "No changes to commit" || git commit -m "Auto-update goal.com results"
          git pull --rebase --autostash origin main || true
          git push

      # Explicitly trigger a Pages redeploy after a successful data commit. Necessary,
      # not optional: a push authenticated with the default GITHUB_TOKEN (which is what
      # actions/checkout uses here, with no custom token configured) does NOT cascade to
      # trigger other workflows via their own `on: push` triggers - this is a deliberate
      # GitHub anti-recursion safeguard, documented behaviour, and it applies regardless
      # of whether [skip ci] is present. Removing [skip ci] alone (done in the same fix)
      # was necessary but not sufficient - this explicit workflow_dispatch call is what
      # actually closes the gap, using the exact same proven pattern as the existing
      # UZ/UAE staleness watchdogs in football-fetch.yml, which already demonstrate this
      # approach works correctly even when triggered from a GITHUB_TOKEN context.
      - name: Trigger Pages redeploy
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          curl -s -X POST -H "Authorization: token $GH_TOKEN" -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/actions/workflows/pages.yml/dispatches" \
            -d '{"ref":"main"}'
