name: Scrape Arsenal results

on:
  schedule:
    # Every 30 minutes -- frequent enough to catch a result promptly after
    # the 120-minutes-post-kickoff mark without hammering the source.
    - cron: '*/30 * * * *'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python deps
        run: pip install requests beautifulsoup4

      - name: Run scraper
        run: python scripts/scrape_arsenal_results.py > scripts/arsenal-last-run-log.txt 2>&1 || echo "SCRAPER_FAILED_SEE_LOG" >> scripts/arsenal-last-run-log.txt
        continue-on-error: true

      - name: Commit results and log
        if: always()
        run: |
          git config user.name "arsenal-results-bot"
          git config user.email "actions@github.com"
          git add data/arsenal-results.json scripts/arsenal-last-run-log.txt scripts/debug-goal-com-*.html || true
          git diff --cached --quiet && echo "No changes to commit" || git commit -m "Auto-update Arsenal results [skip ci]"
          git push
