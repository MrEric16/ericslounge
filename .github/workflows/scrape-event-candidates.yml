name: Find candidate online events (daily)

on:
  schedule:
    - cron: '15 4 * * *'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  find:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python deps
        run: pip install requests

      - name: Run candidate finder
        env:
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python scripts/scrape_event_candidates.py > scripts/event-candidates-log.txt 2>&1 || echo "FETCH_FAILED_SEE_LOG" >> scripts/event-candidates-log.txt

      - name: Commit log
        if: always()
        run: |
          git config user.name "events-bot"
          git config user.email "actions@github.com"
          git add scripts/event-candidates-log.txt || true
          git diff --cached --quiet && echo "No changes to commit" || git commit -m "Update event-candidates log [skip ci]"
          git pull --rebase --autostash origin main || true
          git push
