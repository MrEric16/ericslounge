name: Fetch football-data.org (server-side, key never exposed)

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python deps
        run: pip install requests

      - name: Run fetcher
        env:
          FOOTBALL_DATA_API_KEY: ${{ secrets.FOOTBALL_DATA_API_KEY }}
        run: python scripts/fetch_football_data.py > scripts/football-fetch-log.txt 2>&1 || echo "FETCH_FAILED_SEE_LOG" >> scripts/football-fetch-log.txt

      - name: Commit results and log
        if: always()
        run: |
          git config user.name "football-data-bot"
          git config user.email "actions@github.com"
          git add data/football-live.json scripts/football-fetch-log.txt || true
          git diff --cached --quiet && echo "No changes to commit" || git commit -m "Auto-update live football data [skip ci]"
          git push
