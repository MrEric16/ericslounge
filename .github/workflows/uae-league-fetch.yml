name: Fetch UAE Pro League (every 2 hours)

on:
  schedule:
    - cron: '15 */2 * * *'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python deps
        run: pip install requests beautifulsoup4

      - name: Run scraper
        run: python scripts/scrape_uae_league.py > scripts/uae-league-log.txt 2>&1 || echo "FETCH_FAILED_SEE_LOG" >> scripts/uae-league-log.txt

      - name: Commit results
        run: |
          git config user.name "uae-league-bot"
          git config user.email "actions@github.com"
          git add data/uae-league-live.json scripts/uae-league-log.txt || true
          git diff --cached --quiet && echo "No changes to commit" || git commit -m "Auto-update UAE Pro League [skip ci]"
          git pull --rebase --autostash origin main || true
          git push
