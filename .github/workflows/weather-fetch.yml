name: Fetch weather (server-side, every 2h)

on:
  schedule:
    - cron: '0 */2 * * *'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python deps
        run: pip install requests

      - name: Run fetcher
        run: python scripts/fetch_weather.py

      - name: Commit results
        run: |
          git config user.name "weather-bot"
          git config user.email "actions@github.com"
          git add data/weather-live.json || true
          git diff --cached --quiet && echo "No changes to commit" || git commit -m "Auto-update weather data [skip ci]"
          git pull --rebase --autostash origin main || true
          git push
