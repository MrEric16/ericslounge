name: Fetch Uzbekistan Super League (daily, flashscore)

on:
  schedule:
    - cron: '13 3 * * *'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python deps
        run: |
          pip install requests beautifulsoup4 playwright
          playwright install --with-deps chromium

      - name: Run scraper
        run: python scripts/scrape_uz_league.py > scripts/uz-league-fetch-log.txt 2>&1 || echo "FETCH_FAILED_SEE_LOG" >> scripts/uz-league-fetch-log.txt

      - name: Commit results and log
        if: always()
        run: |
          git config user.name "uz-league-bot"
          git config user.email "actions@github.com"
          git add data/uz-league-live.json scripts/uz-league-fetch-log.txt scripts/debug-uz-*.html || true
          git diff --cached --quiet && echo "No changes to commit" || git commit -m "Auto-update Uzbekistan Super League data [skip ci]"
          git push
