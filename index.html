const ARTICLE_READ_THRESHOLD_MS = 60000;   // 60 seconds
const VIDEO_WATCH_THRESHOLD_MS = 180000;   // 3 minutes

// Articles open in a new tab and navigate away from this page entirely, so
// there's no way to run a foreground timer against the article itself. The
// reliable proxy: how long THIS tab stays hidden after the click, on the
// assumption the person is reading the article in the tab that just opened.
let pendingArticleUrl = null;
let pendingArticleClickTime = null;
function trackArticleOpen(url){
  pendingArticleUrl = url;
  pendingArticleClickTime = Date.now();
}
// Real bug found and fixed: middle-click (a very common desktop habit for
// opening a link in a background tab) fires the 'auxclick' event, NOT
// 'click'. The old inline onclick="" attribute only ever listens for
// 'click', so middle-clicking an article silently skipped tracking entirely
// -- no error, no partial credit, nothing. Listening for both event types
// at the document level (delegated, so it works for every article link
// without needing per-link wiring) covers standard left-click, ctrl/cmd
// click, and middle-click alike.
document.addEventListener('click', handleArticleLinkClick);
document.addEventListener('auxclick', handleArticleLinkClick);
function handleArticleLinkClick(e){
  const link = e.target.closest('a.headline[data-article-url]');
  if(link) trackArticleOpen(link.dataset.articleUrl);
}
document.addEventListener('visibilitychange', ()=>{
  if(document.visibilityState === 'visible' && pendingArticleUrl && pendingArticleClickTime){
    const elapsed = Date.now() - pendingArticleClickTime;
    if(elapsed >= ARTICLE_READ_THRESHOLD_MS){
      const read = getReadArticles();
      read.add(pendingArticleUrl);
      try{ localStorage.setItem('readArticles', JSON.stringify([...read])); }catch(e){}
    }
    pendingArticleUrl = null;
    pendingArticleClickTime = null;
  }
});

// Videos play in an embedded player on this same page, so a straightforward
// foreground timer works -- only counts while the tab is actually visible.
let videoWatchTimer = null;
function trackVideoOpen(videoId){
  clearTimeout(videoWatchTimer);
  const startedAt = Date.now();
  let accumulatedMs = 0;
  let lastResumeTime = document.visibilityState === 'visible' ? Date.now() : null;
  function tick(){
    if(document.visibilityState === 'visible' && lastResumeTime){
      accumulatedMs += Date.now() - lastResumeTime;
      lastResumeTime = Date.now();
    }
    if(accumulatedMs >= VIDEO_WATCH_THRESHOLD_MS){
      const watched = getWatchedVideos();
      watched.add(videoId);
      try{ localStorage.setItem('watchedVideos', JSON.stringify([...watched])); }catch(e){}
      return; // done, no need to keep ticking
    }
    // Stop entirely if the person has navigated away from this video's page
    if(!location.hash.includes(videoId)) return;
    videoWatchTimer = setTimeout(tick, 2000);
  }
  document.addEventListener('visibilitychange', function onVis(){
    if(!location.hash.includes(videoId)){
      document.removeEventListener('visibilitychange', onVis);
      return;
    }
    if(document.visibilityState === 'visible'){
      lastResumeTime = Date.now();
    } else if(lastResumeTime){
      accumulatedMs += Date.now() - lastResumeTime;
      lastResumeTime = null;
    }
  });
  tick();
}

    const latestByUser = {};
    data.forEach(row => { latestByUser[row.user_id] = row; });
    const scores = Object.values(latestByUser).map(row => {
      try{ const p = JSON.parse(row.label); return (p.reads||0) + (p.watches||0); }catch(e){ return 0; }
    }).sort((a,b) => a - b);
    if(scores.length < 5){ box.innerHTML = ''; return; } // not enough data yet to mean anything
    const myScore = getReadArticles().size + getWatchedVideos().size;
    const rank = scores.filter(s => s <= myScore).length;
    const percentile = Math.round((rank / scores.length) * 100);
    if(percentile >= 80){
      box.innerHTML = `<div class="badge-item just-unlocked" style="grid-column:1/-1;"><div class="badge-emoji">🏅</div><div class="badge-name">Top ${100 - percentile + 1}% of readers on the site</div></div>`;
    } else {
      box.innerHTML = ''; // silent for everyone else -- no discouraging message
    }
  }catch(e){ box.innerHTML = ''; }
}

function formatActiveTime(ms){
  const totalMinutes = Math.floor(ms / 60000);
  const hours = Math.floor(totalMinutes / 60);

  return `${minutes}m`;
}

/* ---- 3: Weather-reactive header overlay ---- */
function applyWeatherOverlay(conditionText){
  const el = document.getElementById('weatherOverlay');
  if(!el) return;
  const cond = (conditionText || '').toLowerCase();
  const isRain = /rain|drizzle|shower/.test(cond);
  const isSnow = /snow|sleet/.test(cond);
  if(!isRain && !isSnow){
    el.classList.remove('active');
    el.innerHTML = '';
    return;
  }
  el.innerHTML = '';
  for(let i = 0; i < 24; i++){
    const d = document.createElement('div');
    d.className = 'weather-drop' + (isSnow ? ' snow' : '');
    d.style.left = `${Math.random() * 100}%`;
    d.style.animationDuration = `${isSnow ? 3 + Math.random()*2 : 0.6 + Math.random()*0.5}s`;
    d.style.animationDelay = `${Math.random() * 3}s`;
    el.appendChild(d);
  }
  el.classList.add('active');
}

let snakeGameOpen = false;
function openSnakeGame(){
  if(snakeGameOpen) return;
  snakeGameOpen = true;
  if(navigator.vibrate){ try{ navigator.vibrate([100,50,100,50,200]); }catch(e){} }
  const overlay = document.createElement('div');
  overlay.id = 'snakeOverlay';
  overlay.style.cssText = 'position:fixed;inset:0;background:rgba(0,0,0,.85);z-index:10010;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;';
  overlay.innerHTML = `
    <div style="color:#fff;font-family:'Baloo 2',sans-serif;font-weight:800;font-size:18px;">You found the Konami code.</div>
    <canvas id="snakeCanvas" width="280" height="280" style="background:#0d1f14;border-radius:12px;box-shadow:0 8px 24px rgba(0,0,0,.4);"></canvas>
    <div style="color:#fff;font-family:'Nunito',sans-serif;font-size:13px;">Score: <span id="snakeScore">0</span></div>
    <button id="snakeCloseBtn" style="background:#F2622E;color:#fff;border:none;padding:10px 22px;border-radius:999px;font-weight:700;font-family:'Nunito',sans-serif;">Close</button>
  `;
  document.body.appendChild(overlay);

  const canvas = document.getElementById('snakeCanvas');
  const ctx = canvas.getContext('2d');
  const grid = 14, cells = 20;
  let snake = [{x:9,y:9}];
  let dir = {x:1,y:0};
  let nextDir = {x:1,y:0};
  let food = {x:5,y:5};
  let score = 0;
  let alive = true;

  function placeFood(){ food = { x: Math.floor(Math.random()*cells), y: Math.floor(Math.random()*cells) }; }
  placeFood();

  function draw(){
    ctx.fillStyle = '#0d1f14';
    ctx.fillRect(0,0,canvas.width,canvas.height);
    ctx.fillStyle = '#F0A93C';
    ctx.fillRect(food.x*grid, food.y*grid, grid-1, grid-1);
    snake.forEach((s,i)=>{
      ctx.fillStyle = i===0 ? '#1FA8A3' : '#2F8F7A';
      ctx.fillRect(s.x*grid, s.y*grid, grid-1, grid-1);
    });
  }

  function tick(){
    if(!alive) return;
    dir = nextDir;
    const head = { x: snake[0].x + dir.x, y: snake[0].y + dir.y };
    if(head.x < 0 || head.x >= cells || head.y < 0 || head.y >= cells || snake.some(s => s.x===head.x && s.y===head.y)){
      alive = false;
      ctx.fillStyle = 'rgba(0,0,0,.6)';
      ctx.fillRect(0,0,canvas.width,canvas.height);
      ctx.fillStyle = '#fff';
      ctx.font = 'bold 16px sans-serif';
      ctx.textAlign = 'center';
      ctx.fillText('Game over — ' + score, canvas.width/2, canvas.height/2);
      return;
    }
    snake.unshift(head);
    if(head.x === food.x && head.y === food.y){
      score++;
      document.getElementById('snakeScore').textContent = score;
      placeFood();
    } else {
      snake.pop();
    }
    draw();
  }
  draw();
  const loopId = setInterval(tick, 140);

  function keyHandler(e){
    if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].includes(e.key)) e.preventDefault();
    if(e.key === 'ArrowUp' && dir.y === 0) nextDir = {x:0,y:-1};
    if(e.key === 'ArrowDown' && dir.y === 0) nextDir = {x:0,y:1};
    if(e.key === 'ArrowLeft' && dir.x === 0) nextDir = {x:-1,y:0};
    if(e.key === 'ArrowRight' && dir.x === 0) nextDir = {x:1,y:0};
    if(e.key === 'Escape') closeGame();
  }
  document.addEventListener('keydown', keyHandler);

  function closeGame(){
    clearInterval(loopId);
    document.removeEventListener('keydown', keyHandler);
    overlay.remove();
    snakeGameOpen = false;
  }
  document.getElementById('snakeCloseBtn').addEventListener('click', closeGame);
  overlay.addEventListener('click', (e)=>{ if(e.target === overlay) closeGame(); });
}

(function(){

  const el = document.getElementById('weekendCountdown');
  if(!el) return;
  const cell = el.closest('.board-cell') || el;
  cell.style.cursor = 'pointer';
  // Using 'pointerup' instead of 'click' -- 'click' is a synthesized event that can
  // carry an extra delay on some mobile browsers even with touch-action set, since
  // it still goes through the browser's full click-synthesis pipeline. 'pointerup'
  // fires directly on touch/mouse release with nothing in between.
  cell.addEventListener('pointerup', ()=>{
    tapCount++;
    clearTimeout(tapTimer);
    tapTimer = setTimeout(()=>{ tapCount = 0; }, 1000);
    if(tapCount >= 3){
      tapCount = 0;
      clearTimeout(tapTimer);
      triggerWeekendEgg();

  });
})();

/* ---- 11: fast repeated swipe-up → "Eyo, slow down" ---- */
(function(){
  let touchStartY = null, touchStartTime = null;
  let swipeUpTimes = [];
  document.addEventListener('touchstart', (e)=>{
    if(e.touches.length !== 1) return;
    touchStartY = e.touches[0].clientY;
    touchStartTime = Date.now();
  }, { passive: true });
  document.addEventListener('touchend', (e)=>{
    if(touchStartY === null) return;
    const endY = (e.changedTouches && e.changedTouches[0]) ? e.changedTouches[0].clientY : touchStartY;
    const dy = touchStartY - endY;
    const dt = Date.now() - touchStartTime;
    touchStartY = null;
    if(dy > 100 && dt < 250){
      const now = Date.now();
      swipeUpTimes.push(now);
      swipeUpTimes = swipeUpTimes.filter(t => now - t < 1400);
      if(swipeUpTimes.length >= 4){
        swipeUpTimes = [];
        showToast("Eyo, slow down");
      }
    }
  }, { passive: true });
})();
