// ---------------------------------------------------------------------------------------
// "My Wellbeing" -- private, on-device-only mood tracking, built on top of the emotion
// wheel that already exists at the start of every Mind Temple session.
//
// STORAGE: localStorage only, one browser, one device. Never sent anywhere, never synced,
// no login exists on this site to sync it TO even if that were ever wanted. This is the
// deliberate, load-bearing design choice, not an implementation detail -- this is minors'
// emotional data and the only version of this feature that's safe to ship by default is
// one where nobody but the student, on their own device, can ever see it. If cross-device
// sync or any teacher-visible aggregate is ever wanted later, that's a fundamentally
// different feature with its own consent/privacy questions, not an extension of this one.
//
// WHAT GETS LOGGED: only the category + specific word picked from the emotion wheel, plus
// a timestamp. Deliberately NOT the free-text situation/thought/action answers from later
// in the flow -- keeps the stored data minimal, and keeps this feature fully separate from
// the acute-distress keyword detection (which only ever runs on that free text and is its
// own, more serious pathway). A repeated hard pattern showing up in a casual bar chart
// would either trivialize a real signal or make it feel exposed in the wrong context, so
// this tracker only ever sees the same emotion-wheel picks a student already sees appear
// as colored buttons -- nothing heavier than that.
const MT_MOOD_LOG_KEY = 'mtMoodLog_v1';
const MT_MOOD_LOG_MAX_ENTRIES = 500; // plenty for meaningful patterns; caps unbounded growth

function mtLoadMoodLog(){
  try{
    const raw = localStorage.getItem(MT_MOOD_LOG_KEY);
    const parsed = raw ? JSON.parse(raw) : [];
    return Array.isArray(parsed) ? parsed : [];
  }catch(e){ return []; }
}
function mtSaveMoodLog(log){
  try{ localStorage.setItem(MT_MOOD_LOG_KEY, JSON.stringify(log.slice(-MT_MOOD_LOG_MAX_ENTRIES))); }catch(e){}
}
function mtLogMoodEntry(category, word, valence){
  const log = mtLoadMoodLog();
  log.push({ ts: Date.now(), category, word, valence });
  mtSaveMoodLog(log);
}
function mtClearMoodLog(){
  try{ localStorage.removeItem(MT_MOOD_LOG_KEY); }catch(e){}
}

const MT_VALENCE_SCORE = { positive: 1, neutral: 0, negative: -1 };
const MT_TIME_BUCKETS = [
  { key:'morning',   label:'Morning',   test: h => h >= 5  && h < 12 },
  { key:'afternoon', label:'Afternoon', test: h => h >= 12 && h < 17 },
  { key:'evening',   label:'Evening',   test: h => h >= 17 && h < 21 },
  { key:'night',     label:'Night',     test: h => h >= 21 || h < 5  },
];
const MT_WEEKDAY_LABELS = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
const MT_WELLBEING_MIN_ENTRIES = 5; // below this, a chart would just be showing one bad day as "your pattern"

// Pure function: log entries in, every stat the dashboard needs out. Kept separate from
// rendering so it's independently testable against constructed fixtures.
function mtComputeWellbeingStats(log){
  const total = log.length;
  if(total === 0) return { total: 0 };

  const categoryCounts = {};
  const categoryBreakdown = {}; // key -> {positive,neutral,negative}
  MT_EMOTIONS.forEach(c => { categoryCounts[c.key] = 0; categoryBreakdown[c.key] = { positive:0, neutral:0, negative:0 }; });
  const valenceCounts = { positive: 0, neutral: 0, negative: 0 };
  const timeOfDayBreakdown = { morning: { positive:0, neutral:0, negative:0 }, afternoon: { positive:0, neutral:0, negative:0 }, evening: { positive:0, neutral:0, negative:0 }, night: { positive:0, neutral:0, negative:0 } };
  const weekdayBreakdown = [0,1,2,3,4,5,6].map(()=> ({ positive:0, neutral:0, negative:0 }));
  const dailyValence = {}; // 'YYYY-MM-DD' -> [scores] -- trend line still uses average valence, unaffected by the stacked-bar rework below

  log.forEach(e => {
    if(categoryCounts[e.category] !== undefined) categoryCounts[e.category]++;
    if(valenceCounts[e.valence] !== undefined) valenceCounts[e.valence]++;
    if(categoryBreakdown[e.category] && categoryBreakdown[e.category][e.valence] !== undefined) categoryBreakdown[e.category][e.valence]++;
    const d = new Date(e.ts);
    const hour = d.getHours();
    const score = MT_VALENCE_SCORE[e.valence] ?? 0;
    const bucket = MT_TIME_BUCKETS.find(b => b.test(hour));
    if(bucket && timeOfDayBreakdown[bucket.key][e.valence] !== undefined) timeOfDayBreakdown[bucket.key][e.valence]++;
    if(weekdayBreakdown[d.getDay()][e.valence] !== undefined) weekdayBreakdown[d.getDay()][e.valence]++;
    const dayKey = d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
    (dailyValence[dayKey] = dailyValence[dayKey] || []).push(score);
  });

  const avg = arr => arr.length ? arr.reduce((a,b)=>a+b,0) / arr.length : null;

  const mostCommonCategory = Object.entries(categoryCounts).sort((a,b)=> b[1]-a[1])[0];

  // Last 30 calendar days with data, oldest to newest, for the trend line.
  const trend = Object.keys(dailyValence).sort().slice(-30).map(day => ({
    day, avgValence: avg(dailyValence[day])
  }));

  // Check-in streak: consecutive calendar days with at least one entry, counting backward
  // from today. Breaks the moment a day is missing -- doesn't care what the mood WAS on
  // any of those days, only that a check-in happened, on purpose (rewards the habit, not
  // the feeling).
  let streak = 0;
  const cursor = new Date();
  while(true){
    const key = cursor.getFullYear() + '-' + String(cursor.getMonth()+1).padStart(2,'0') + '-' + String(cursor.getDate()).padStart(2,'0');
    if(dailyValence[key]){ streak++; cursor.setDate(cursor.getDate()-1); }
    else break;
  }

  // "Compared to usual": most common category in the last 7 days vs all-time. Only
  // surfaced if there's actually enough recent data to say anything meaningful, and only
  // if it differs from the all-time leader -- otherwise there's nothing worth saying.
  const sevenDaysAgo = Date.now() - 7*24*60*60*1000;
  const recentLog = log.filter(e => e.ts >= sevenDaysAgo);
  let recentShift = null;
  if(recentLog.length >= 3){
    const recentCounts = {};
    recentLog.forEach(e => { recentCounts[e.category] = (recentCounts[e.category]||0) + 1; });
    const recentTop = Object.entries(recentCounts).sort((a,b)=> b[1]-a[1])[0];
    if(recentTop && mostCommonCategory && recentTop[0] !== mostCommonCategory[0]){
      recentShift = recentTop[0];
    }
  }

  return {
    total,
    categoryCounts,
    categoryBreakdown,
    valenceCounts,
    mostCommonCategory: mostCommonCategory ? mostCommonCategory[0] : null,
    timeOfDay: MT_TIME_BUCKETS.map(b => ({ key:b.key, label:b.label, ...timeOfDayBreakdown[b.key] })),
    weekday: MT_WEEKDAY_LABELS.map((label,i) => ({ label, dayIndex:i, ...weekdayBreakdown[i] })),
    trend,
    streak,
    recentShift,
  };
}
// A single blended average (old approach) hides real mixes -- a category that's half
// "Excited" (positive) and half "Nervous" (negative) doesn't have one true color, it has
// two. mtValenceColor(avg) is kept only for the one-line headline text ("Most logged:
// X") where a single color is unavoidable; every actual CHART now shows the full
// pos/neutral/negative composition as stacked segments instead of collapsing it into one
// number. Majority-valence, not average, decides the headline color -- more consistent
// with "which color has the most weight in this stack" than a continuous average would be.
function mtValenceColor(kindOrAvg){
  if(kindOrAvg === 'positive') return '#5A8F4E';
  if(kindOrAvg === 'negative') return '#A6342E';
  if(kindOrAvg === 'neutral') return '#B6B235';
  const v = kindOrAvg || 0;
  if(v > 0.2) return '#5A8F4E';
  if(v < -0.2) return '#A6342E';
  return '#B6B235';
}
function mtMajorityValenceColor(breakdown){
  if(!breakdown) return mtValenceColor('neutral');
  const entries = [['positive',breakdown.positive||0], ['neutral',breakdown.neutral||0], ['negative',breakdown.negative||0]];
  entries.sort((a,b)=> b[1]-a[1]);
  return entries[0][1] > 0 ? mtValenceColor(entries[0][0]) : mtValenceColor('neutral');
}

// Sub-emotion (word-level) breakdown for whatever entries underlie a clicked bar/point --
// most common first, as requested. Percentages rounded, not guaranteed to sum to exactly
// 100 for small n (e.g. 3 entries splitting 33/33/33 rounds to 99) -- accepted, exact-sum
// rounding isn't worth the complexity for a handful of check-ins.
function mtWordBreakdown(entries){
  const counts = {};
  entries.forEach(e => { counts[e.word] = (counts[e.word]||0) + 1; });
  const total = entries.length;
  return Object.entries(counts)
    .map(([word,count]) => ({ word, count, pct: total ? Math.round(100*count/total) : 0 }))
    .sort((a,b)=> b.count - a.count);
}
function mtEntriesForCategory(log, key){ return log.filter(e => e.category === key); }
function mtEntriesForTimeBucket(log, key){
  const bucket = MT_TIME_BUCKETS.find(b => b.key === key);
  return bucket ? log.filter(e => bucket.test(new Date(e.ts).getHours())) : [];
}
function mtEntriesForWeekday(log, dayIndex){ return log.filter(e => new Date(e.ts).getDay() === dayIndex); }
function mtEntriesForDay(log, dayKey){
  return log.filter(e => {
    const d = new Date(e.ts);
    return (d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0')) === dayKey;
  });
}
function mtShowBreakdownPopup(title, entries){
  const existing = document.getElementById('wbBreakdownOverlay');
  if(existing) existing.remove();
  const breakdown = mtWordBreakdown(entries);
  const overlay = document.createElement('div');
  overlay.id = 'wbBreakdownOverlay';
  overlay.className = 'wb-breakdown-overlay';
  overlay.innerHTML = `
    <div class="wb-breakdown-card">
      <div class="wb-breakdown-title">${escapeHtml(title)}</div>
      <div class="wb-breakdown-sub">${entries.length} check-in${entries.length===1?'':'s'}</div>
      ${breakdown.length === 0 ? '<p class="mt-intro" style="margin:12px 0 0;">Nothing logged here yet.</p>' : breakdown.map(b => `
        <div class="wb-breakdown-row">
          <span class="wb-breakdown-word">${escapeHtml(b.word)}</span>
          <span class="wb-breakdown-pct">${b.pct}%</span>
        </div>
      `).join('')}
      <button class="mt-yn-btn mt-primary" data-action="close-wb-breakdown" style="margin-top:16px; width:100%;">Close</button>
    </div>
  `;
  document.body.appendChild(overlay);
  overlay.addEventListener('click', (e)=>{ if(e.target === overlay) overlay.remove(); });
  overlay.querySelector('[data-action="close-wb-breakdown"]').addEventListener('click', ()=> overlay.remove());
}

// ---- Minimal hand-rolled canvas chart helpers (no external charting library, consistent
// with how every embedded game already draws directly to canvas in this file) ----
// Stacked composition bars: total bar height reflects how often that bucket was logged,
// and the three colored segments show the actual positive/neutral/negative makeup instead
// of collapsing it into one blended color. Returns each bar's full clickable geometry
// (spanning the whole column, not just the drawn stack, so clicking near a short/empty bar
// still registers) for the caller to wire up click-to-breakdown interactivity.
function mtDrawStackedBarChart(canvas, bars){
  const ctx = canvas.getContext('2d');
  const dpr = window.devicePixelRatio || 1;
  const w = canvas.clientWidth, h = canvas.clientHeight;
  canvas.width = w * dpr; canvas.height = h * dpr;
  ctx.setTransform(dpr,0,0,dpr,0,0);
  ctx.clearRect(0,0,w,h);

  const padBottom = 28, padTop = 10;
  const plotH = h - padBottom - padTop;
  const n = bars.length;
  const geometry = [];
  if(n === 0) return geometry;
  const gap = 8;
  const barW = (w - gap*(n+1)) / n;
  const baseline = padTop + plotH;
  const maxTotal = Math.max(1, ...bars.map(b => (b.positive||0)+(b.neutral||0)+(b.negative||0)));

  bars.forEach((b, i) => {
    const x = gap + i*(barW+gap);
    const total = (b.positive||0)+(b.neutral||0)+(b.negative||0);
    const totalH = total/maxTotal * plotH;
    // Stack order bottom-to-top: negative, neutral, positive.
    let y = baseline;
    const segs = [
      { count: b.negative||0, color: mtValenceColor('negative') },
      { count: b.neutral||0,  color: mtValenceColor('neutral')  },
      { count: b.positive||0, color: mtValenceColor('positive') },
    ];
    segs.forEach(seg => {
      const segH = total > 0 ? (seg.count/total) * totalH : 0;
      if(segH > 0){
        ctx.fillStyle = seg.color;
        ctx.fillRect(x, y - segH, barW, segH);
      }
      y -= segH;
    });
    ctx.fillStyle = '#5a4632';
    ctx.font = '11px sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText(b.label, x + barW/2, h - padBottom + 14);
    // Clickable region spans the FULL column (padTop to baseline), not just the drawn
    // stack -- an empty or tiny bar should still be tappable, not require pixel-precision.
    geometry.push({ label: b.label, x, y: padTop, w: barW, h: plotH, key: b.key, dayIndex: b.dayIndex, positive: b.positive||0, neutral: b.neutral||0, negative: b.negative||0, total });
  });
  return geometry;
}
function mtDrawLineChart(canvas, points, opts){
  opts = opts || {};
  const ctx = canvas.getContext('2d');
  const dpr = window.devicePixelRatio || 1;
  const w = canvas.clientWidth, h = canvas.clientHeight;
  canvas.width = w * dpr; canvas.height = h * dpr;
  ctx.setTransform(dpr,0,0,dpr,0,0);
  ctx.clearRect(0,0,w,h);
  if(points.length === 0) return [];

  const padX = 10, padY = 14;
  const plotW = w - padX*2, plotH = h - padY*2;
  const n = points.length;
  const zeroY = padY + plotH/2; // valence range is -1..1, zero sits in the middle

  ctx.strokeStyle = 'rgba(90,70,50,0.2)';
  ctx.beginPath(); ctx.moveTo(padX, zeroY); ctx.lineTo(w-padX, zeroY); ctx.stroke();

  ctx.strokeStyle = opts.color || '#2E7B8A';
  ctx.lineWidth = 2;
  ctx.beginPath();
  points.forEach((p, i) => {
    const x = n === 1 ? padX + plotW/2 : padX + (i/(n-1)) * plotW;
    const v = p.avgValence == null ? 0 : p.avgValence;
    const y = zeroY - v * (plotH/2);
    if(i === 0) ctx.moveTo(x,y); else ctx.lineTo(x,y);
  });
  ctx.stroke();

  const geometry = [];
  ctx.fillStyle = opts.color || '#2E7B8A';
  points.forEach((p, i) => {
    const x = n === 1 ? padX + plotW/2 : padX + (i/(n-1)) * plotW;
    const v = p.avgValence == null ? 0 : p.avgValence;
    const y = zeroY - v * (plotH/2);
    ctx.beginPath(); ctx.arc(x, y, 2.5, 0, Math.PI*2); ctx.fill();
    geometry.push({ x, y, day: p.day });
  });
  return geometry;
}
// Attaches a single click listener to a canvas that hit-tests against previously-returned
// bar/point geometry and opens the breakdown popup for whichever one was hit.
function mtWireBarClicks(canvas, geometry, log, entriesFor, titlePrefix){
  canvas.addEventListener('click', (e)=>{
    const rect = canvas.getBoundingClientRect();
    const x = e.clientX - rect.left, y = e.clientY - rect.top;
    const bar = geometry.find(g => x >= g.x && x <= g.x + g.w && y >= g.y && y <= g.y + g.h);
    if(!bar) return;
    const entries = entriesFor(log, bar.key !== undefined ? bar.key : bar.dayIndex);
    mtShowBreakdownPopup(`${titlePrefix}${bar.label}`, entries);
  });
}
function mtWirePointClicks(canvas, geometry, log, titlePrefix){
  const HIT_RADIUS = 12;
  canvas.addEventListener('click', (e)=>{
    const rect = canvas.getBoundingClientRect();
    const x = e.clientX - rect.left, y = e.clientY - rect.top;
    let closest = null, closestDist = Infinity;
    geometry.forEach(g => {
      const dist = Math.hypot(x - g.x, y - g.y);
      if(dist < closestDist){ closestDist = dist; closest = g; }
    });
    if(!closest || closestDist > HIT_RADIUS) return;
    const entries = mtEntriesForDay(log, closest.day);
    const dateLabel = new Date(closest.day + 'T00:00:00').toLocaleDateString(undefined, { month:'short', day:'numeric' });
    mtShowBreakdownPopup(`${titlePrefix}${dateLabel}`, entries);
  });
}
function mtMountWellbeing(container){
  const log = mtLoadMoodLog();
  const stats = mtComputeWellbeingStats(log);
  if(stats.total < MT_WELLBEING_MIN_ENTRIES) return; // nothing to draw yet, HTML already shows the "keep checking in" message

  const catChart = container.querySelector('#wbCategoryChart');
  if(catChart){
    const bars = MT_EMOTIONS.map(c => ({ label: c.label, key: c.key, ...stats.categoryBreakdown[c.key] }));
    const geometry = mtDrawStackedBarChart(catChart, bars);
    mtWireBarClicks(catChart, geometry, log, mtEntriesForCategory, '');
  }
  const todChart = container.querySelector('#wbTimeOfDayChart');
  if(todChart){
    const bars = stats.timeOfDay.map(b => ({ label: b.label, key: b.key, positive: b.positive, neutral: b.neutral, negative: b.negative }));
    const geometry = mtDrawStackedBarChart(todChart, bars);
    mtWireBarClicks(todChart, geometry, log, mtEntriesForTimeBucket, '');
  }
  const dowChart = container.querySelector('#wbDayOfWeekChart');
  if(dowChart){
    const bars = stats.weekday.map(b => ({ label: b.label, dayIndex: b.dayIndex, positive: b.positive, neutral: b.neutral, negative: b.negative }));
    const geometry = mtDrawStackedBarChart(dowChart, bars);
    mtWireBarClicks(dowChart, geometry, log, mtEntriesForWeekday, '');
  }
  const trendChart = container.querySelector('#wbTrendChart');
  if(trendChart && stats.trend.length >= 2){
    const geometry = mtDrawLineChart(trendChart, stats.trend);
    mtWirePointClicks(trendChart, geometry, log, '');
  }
}

let mtState = null;
let mtActiveEmbeddedCleanup = null; // cleanup() of whichever embedded mess-about game is currently mounted, if any
function mtInit(){
  if(mtActiveEmbeddedCleanup){ mtActiveEmbeddedCleanup(); mtActiveEmbeddedCleanup = null; }
  mtState = { step:'picker', category:null, emotion:null, situation:'', thought:'', actionTaken:null, actionDescription:'', resolution:'', messAboutPick:null, messAboutCycleIndex:0 };
  mtRender();
}
function mtGoTo(step){
  mtState.step = step;
  mtRender();
}
// Positive emotions skip the "resolution" question entirely -- "what could constructively
// resolve this?" makes no sense after describing something that made you feel joyful or
// trusting. Only negative/neutral flows (something that actually needs resolving) ask it.
// Reads MT_WORD_VALENCE keyed on the actual word picked (mtState.emotion), not the
// category it was found under -- category-level valence was the original bug: "Excited"
// and "Optimistic" sit in both Joy's list (positive) and Anticipation's list (was neutral),
// so picking them via "Eager" got the wrong treatment even though the word itself is
// unambiguously positive. Falls back to the category's valence only if a word somehow
// isn't in the map, which shouldn't happen -- verified all 151 words have an entry.
function mtIsPositive(){
  const wordValence = MT_WORD_VALENCE[mtState.emotion];
  if(wordValence) return wordValence === 'positive';
  const cat = MT_EMOTIONS.find(c => c.key === mtState.category);
  return cat && cat.valence === 'positive';
}
function mtAfterAction(){
  mtGoTo(mtIsPositive() ? 'closing' : 'resolution');
}
function mtExit(){
  // Any embedded mess-about game's animation loop/AI timer must be torn down explicitly --
  // it does NOT stop on its own just because this panel's DOM gets replaced by whatever
  // route is navigated to next; a detached canvas's requestAnimationFrame loop keeps firing
  // (and eating battery) forever otherwise.
  if(mtActiveEmbeddedCleanup){ mtActiveEmbeddedCleanup(); mtActiveEmbeddedCleanup = null; }
  // Leaving Mind Temple always lands on a freshly-scrolled-to-top homepage, never wherever
  // the user happened to be scrolled to before they opened it -- deliberately different
  // from every other page on the site, which does remember scroll position. The point is
  // that closing this specific tool shouldn't leave the Mind Temple tile sitting right in
  // front of someone's eyes the moment they exit; they should have to actively choose to
  // scroll back down to it. Achieved by zeroing out the home route's saved scroll position
  // before navigating, rather than fighting the hashchange event's timing directly.
  try{
    const mem = getScrollMemory();
    mem[''] = 0;
    saveScrollMemory(mem);
  }catch(e){}
  // No longer touches location.hash -- see mtOpenOverlay/mtCloseOverlay above renderRoute
  // for why: Mind Temple's URL never changes while it's open, on purpose, so there is
  // nothing in browser history for the swipe-back gesture to navigate to in the first
  // place. Exiting just closes the overlay directly.
  mtCloseOverlay();
}
function mtRender(){
  const container = document.getElementById('mtContainer');
  if(!container) return;
  // Single choke point for embedded-game teardown -- every re-render (any step, any
  // reason) tears down whatever embedded game was previously mounted before wiping the
  // container's HTML. This covers "try another", moving on to the questions, going back,
  // and everything else in one place rather than special-casing each transition.
  if(mtActiveEmbeddedCleanup){ mtActiveEmbeddedCleanup(); mtActiveEmbeddedCleanup = null; }
  container.innerHTML = mtStepHtml();
  mtWireStep(container);
  if(mtState.step === 'messAboutAfter' && mtState.messAboutPick){
    mtActivateMessAboutPick(container);
  }
  if(mtState.step === 'wellbeing'){
    mtMountWellbeing(container);
  }
}
// Opens the current mess-about pick: window.open for the 9 external sites (unchanged,
// confirmed working correctly on mobile -- opens within the app's own context rather than
// redirecting to Safari), or mounts the matching embedded game inline into the slot
// rendered by messAboutAfter's HTML for the 4 in-house games.
// Shared by every embedded game's mount point, below -- attached to whichever canvas(es)
// a game creates immediately after it mounts. Applied centrally rather than trusting each
// individual game's own code to remember it, specifically so it can never be missed for
// any future game either. touch-action:none (in CSS, on .mt-embedded-canvas) is the
// standard way to suppress native touch gestures on an element, but real devices vary in
// how strictly they respect it for edge-originating swipes that would otherwise trigger
// the browser/OS back-navigation gesture -- explicit preventDefault() on the raw touch
// events (registered as non-passive, which is required for preventDefault to actually
// take effect on touchstart/touchmove) is the belt-and-suspenders addition that closes
// the gap CSS alone sometimes leaves open.
function mtPreventTouchNav(el){
  const opts = { passive: false };
  const prevent = (e) => { e.preventDefault(); };
  el.addEventListener('touchstart', prevent, opts);
  el.addEventListener('touchmove', prevent, opts);
}
// Shared win/lose popup used by every game with a clear win/lose outcome (checkers,
// chess, connect four, reversi, tug of war, rumble). Dismissable by swiping in any
// direction OR by a plain tap -- both are handled by the same pointer sequence: if the
// finger moved past a small threshold before release, treat it as a swipe-dismiss;
// otherwise treat it as a tap-dismiss. `kind` is 'win' or 'lose', purely for styling.
function mtShowResultPopup(container, text, kind){
  const existing = container.querySelector('.mt-result-overlay');
  if(existing) existing.remove();
  if(!container.style.position) container.style.position = 'relative';
  const overlay = document.createElement('div');
  overlay.className = 'mt-result-overlay';
  overlay.innerHTML = `<div class="mt-result-card mt-result-${kind==='win'?'win':'lose'}">${escapeHtml(text)}<div class="mt-result-hint">Tap or swipe to dismiss</div></div>`;
  container.appendChild(overlay);
  const card = overlay.querySelector('.mt-result-card');
  let startX=0, startY=0, dragging=false, moved=false;
  function dismiss(){ overlay.remove(); }
  function pointOf(e){ return e.changedTouches ? e.changedTouches[0] : e; }
  function onDown(e){
    dragging = true; moved = false;
    const p = pointOf(e);
    startX = p.clientX; startY = p.clientY;
    card.style.transition = 'none';
  }
  function onMove(e){
    if(!dragging) return;
    const p = pointOf(e);
    const dx = p.clientX-startX, dy = p.clientY-startY;
    if(Math.abs(dx)+Math.abs(dy) > 6) moved = true;
    card.style.transform = `translate(${dx}px, ${dy}px)`;
    const dist = Math.sqrt(dx*dx+dy*dy);
    overlay.style.opacity = Math.max(0.15, 1 - dist/180);
  }
  function onUp(e){
    if(!dragging) return;
    dragging = false;
    const p = pointOf(e);
    const dx = p.clientX-startX, dy = p.clientY-startY;
    const dist = Math.sqrt(dx*dx+dy*dy);
    if(dist > 50 || !moved){ dismiss(); return; }
    card.style.transition = '';
    card.style.transform = '';
    overlay.style.opacity = '';
  }
  overlay.addEventListener('pointerdown', onDown);
  overlay.addEventListener('pointermove', onMove);
  overlay.addEventListener('pointerup', onUp);
  overlay.addEventListener('pointerleave', onUp);
  return dismiss;
}
function mtActivateMessAboutPick(container){
  const pick = mtState.messAboutPick;
  if(!pick) return;
  if(pick.type === 'external'){
    window.open(pick.url, '_blank', 'noopener');
    return;
  }
  const game = MT_EMBEDDED_GAMES[pick.id];
  const slot = container.querySelector('#mtEmbeddedGameSlot');
  if(!game || !slot) return;
  mtActiveEmbeddedCleanup = game.mount(slot);
  slot.querySelectorAll('canvas').forEach(mtPreventTouchNav);
}

    `;
  }
  if(s.step === 'messAboutAfter'){

    const game = isEmbedded ? MT_EMBEDDED_GAMES[pick.id] : null;
    return `
      <div class="mt-closing-box">
        ${game ? `<div class="mt-embedded-title">${escapeHtml(game.title)}</div><div id="mtEmbeddedGameSlot" class="mt-embedded-slot"></div>` : ''}
        <div class="mt-closing-msg">Try another one, or ready to try figure it out?</div>
        <div class="mt-yn-row">
          <button class="mt-yn-btn mt-primary" data-action="messabout-another">Try another one</button>
          <button class="mt-yn-btn" data-action="messabout-ready">I'm ready to try figure it out</button>
        </div>
      </div>

      <div class="mt-question">You picked "${escapeHtml(s.emotion)}." Want to talk about it?</div>
      <div class="mt-yn-row">
        <button class="mt-yn-btn mt-primary" data-action="talk-yes">Yes</button>
        <button class="mt-yn-btn" data-action="talk-no">No</button>
      </div>
    `;
  }
  if(s.step === 'declined'){
    // Not wanting to talk about the situation itself doesn't mean not wanting a small
    // distraction -- those are two different asks, and the tool was treating "no" to the
    // first one as "no" to everything, ending the whole session right there. Now it offers
    // the same read/watch/do choice used at the end of the full flow.
    const msg = mtIsPositive()
      ? "Glad to hear it. Want to read, watch, or do something anyway?"
      : "I hope you feel better. Want to read, watch, or do something?";
    return `
      <div class="mt-closing-box">
        <div class="mt-closing-msg">${escapeHtml(msg)}</div>
        <div class="mt-yn-row">
          <button class="mt-yn-btn mt-primary" data-action="comfort-yes">Yes</button>
          <button class="mt-yn-btn" data-action="comfort-no">No</button>
        </div>
      </div>
    `;
  }
  if(s.step === 'situation'){
    return `
      <button class="mt-back-link" data-action="back-to-talk">← Back</button>
      <div class="mt-question">What's the situation that's making you feel this way?</div>
      <textarea class="mt-textarea" id="mtInput" placeholder="Write as much or as little as you want…">${escapeHtml(s.situation)}</textarea>
      <div class="mt-nav-row">
        <button class="mt-next-btn" data-action="next-situation">Next</button>
      </div>
      <button class="mt-exit-btn" data-action="exit">Exit without finishing</button>
    `;
  }
  if(s.step === 'thought'){
    const positive = mtIsPositive();
    const question = positive
      ? "That's awesome! Want to share more about it?"
      : "What was your immediate thought when this happened?";
    const placeholder = positive
      ? "Whatever comes to mind…"
      : "The first thing that went through your head…";
    return `
      <button class="mt-back-link" data-action="back-to-situation">← Back</button>
      <div class="mt-question">${escapeHtml(question)}</div>
      <textarea class="mt-textarea" id="mtInput" placeholder="${escapeHtml(placeholder)}">${escapeHtml(s.thought)}</textarea>
      <div class="mt-nav-row">
        <button class="mt-next-btn" data-action="next-thought">Next</button>
      </div>
      <button class="mt-exit-btn" data-action="exit">Exit without finishing</button>
    `;
  }
  if(s.step === 'actionAsked'){
    // "Did you actually do anything about it?" presumes there was a problem needing
    // action -- doesn't make sense for a positive reflection. Positive flows get an
    // open question about carrying the feeling forward instead of a yes/no action gate,
    // and skip straight to closing rather than branching into actionDescription/resolution.
    if(mtIsPositive()){
      return `
        <button class="mt-back-link" data-action="back-to-thought">← Back</button>
        <div class="mt-question">How are you planning to channel your positivity?</div>
        <textarea class="mt-textarea" id="mtInput" placeholder="Doesn't have to be a plan -- just what comes to mind…">${escapeHtml(s.actionDescription)}</textarea>
        <div class="mt-nav-row">
          <button class="mt-next-btn" data-action="next-channelPositivity">Next</button>
        </div>
        <button class="mt-exit-btn" data-action="exit">Exit without finishing</button>
      `;
    }
    return `
      <button class="mt-back-link" data-action="back-to-thought">← Back</button>
      <div class="mt-question">Did you actually do anything about it?</div>
      <div class="mt-yn-row">
        <button class="mt-yn-btn mt-primary" data-action="action-yes">Yes</button>
        <button class="mt-yn-btn" data-action="action-no">Not yet</button>
      </div>
      <button class="mt-exit-btn" data-action="exit" style="margin-top:14px;">Exit without finishing</button>
    `;
  }
  if(s.step === 'actionDescription'){
    return `
      <button class="mt-back-link" data-action="back-to-actionAsked">← Back</button>
      <div class="mt-question">What did you do?</div>
      <textarea class="mt-textarea" id="mtInput" placeholder="Describe what you did…">${escapeHtml(s.actionDescription)}</textarea>
      <div class="mt-nav-row">
        <button class="mt-next-btn" data-action="next-actionDescription">Next</button>
      </div>
      <button class="mt-exit-btn" data-action="exit">Exit without finishing</button>
    `;
  }
  if(s.step === 'resolution'){
    return `
      <button class="mt-back-link" data-action="back-to-actionAsked">← Back</button>
      <div class="mt-question">What do you think could constructively resolve this?</div>
      <textarea class="mt-textarea" id="mtInput" placeholder="Doesn't have to be perfect -- just what comes to mind…">${escapeHtml(s.resolution)}</textarea>
      <div class="mt-nav-row">
        <button class="mt-next-btn" data-action="next-resolution">Next</button>
      </div>
      <button class="mt-exit-btn" data-action="exit">Exit without finishing</button>
    `;
  }
  if(s.step === 'closing'){
    const acute = mtIsAcute(s.situation) || mtIsAcute(s.thought) || mtIsAcute(s.actionDescription);
    const isPositive = mtIsPositive();
    // Acute detection always wins regardless of which emotion word was picked -- someone
    // could pick a positive word and still write something concerning in their own words
    // further down, and the safety net shouldn't be skippable by word choice.
    if(acute){
      return `
        <div class="mt-closing-box">
          <div class="mt-closing-msg">Thank you for writing that down. Please find Mr Eric in person today, as soon as you can. If he's not around, tell another adult you trust — right now, not later.</div>
          <button class="mt-resolve-btn" data-action="exit">Done</button>
        </div>
      `;
    }
    if(isPositive){
      // The original version showed "talk to Mr Eric" after EVERY reflection, including
      // ones that started with picking "Joyful" or "Trusting" -- caught immediately because
      // it makes no sense to push someone toward a serious conversation about something
      // that made them feel good. Positive reflections just close out warmly instead.
      return `
        <div class="mt-closing-box">
          <div class="mt-closing-msg">Thank you for writing that down. It's good to notice what's going well, too.</div>
          <button class="mt-resolve-btn" data-action="exit">Done</button>
        </div>
      `;
    }
    // Everyday negative/neutral discomfort (jealousy, mild frustration, being startled,
    // etc.) doesn't warrant "go talk to a teacher" -- that was a real overcorrection,
    // reported directly and fixed here. "Talk to Mr Eric" is now reserved exclusively for
    // the acute tier above. Everything else gets offered a small distraction instead.
    return `
      <div class="mt-closing-box">
        <div class="mt-closing-msg">Thank you for writing that down. I hope you feel better soon. Want to read, watch, or do something?</div>
        <div class="mt-yn-row">
          <button class="mt-yn-btn mt-primary" data-action="comfort-yes">Yes</button>
          <button class="mt-yn-btn" data-action="comfort-no">No</button>
        </div>
      </div>
    `;
  }
  if(s.step === 'comfortDeclined'){
    return `
      <div class="mt-closing-box">
        <div class="mt-closing-msg">Feel free to come back whenever you want.</div>
        <button class="mt-resolve-btn" data-action="exit">Done</button>
      </div>
    `;
  }
  if(s.step === 'comfortChoice'){
    return `
      <div class="mt-closing-box">
        <div class="mt-closing-msg">Read, watch, or do something?</div>
        <div class="mt-yn-row">
          <button class="mt-yn-btn mt-primary" data-action="comfort-read">Read</button>
          <button class="mt-yn-btn mt-primary" data-action="comfort-watch">Watch</button>
          <button class="mt-yn-btn mt-primary" data-action="comfort-do">Do</button>
        </div>
      </div>
    `;
  }
  return '';
}

function mtWireStep(container){
  const s = mtState;
  container.querySelectorAll('[data-cat]').forEach(btn => {
    btn.addEventListener('click', ()=>{ s.category = btn.dataset.cat; mtGoTo('subpicker'); });
  });
  container.querySelectorAll('[data-word]').forEach(btn => {
    btn.addEventListener('click', ()=>{
      s.emotion = btn.dataset.word;
      const wordValence = MT_WORD_VALENCE[s.emotion];
      mtLogMoodEntry(s.category, s.emotion, wordValence);
      // Genuinely negative feelings get offered a breather before the questions start --
      // positive and neutral ones go straight to talkAboutIt, unchanged, since "want to
      // mess about first?" only makes sense ahead of something that's actually difficult.
      mtGoTo(wordValence === 'negative' ? 'messAboutOffer' : 'talkAboutIt');
    });
  });
  const backToPicker = container.querySelector('[data-action="back-to-picker"]');
  if(backToPicker) backToPicker.addEventListener('click', ()=> mtGoTo('picker'));

  const openWellbeing = container.querySelector('[data-action="open-wellbeing"]');
  if(openWellbeing) openWellbeing.addEventListener('click', ()=> mtGoTo('wellbeing'));

  const clearWellbeing = container.querySelector('[data-action="clear-wellbeing"]');
  if(clearWellbeing) clearWellbeing.addEventListener('click', ()=>{
    if(confirm('Clear your private mood log on this device? This can\'t be undone.')){
      mtClearMoodLog();
      mtGoTo('wellbeing');
    }
  });

  // "Mess about" flow -- offer shown for negative-valence words, before the questions.
  // Pool is now every embedded game, cycled through in a fixed order (not randomized) --
  // each new session starts at the first game, and "try another" advances one at a time,
  // wrapping back to the start after the last one.
  function mtPickMessAboutPick(){
    const pick = MT_MESSABOUT_POOL[s.messAboutCycleIndex % MT_MESSABOUT_POOL.length];
    s.messAboutCycleIndex = (s.messAboutCycleIndex + 1) % MT_MESSABOUT_POOL.length;
    return pick;
  }
  const messaboutYes = container.querySelector('[data-action="messabout-yes"]');
  if(messaboutYes) messaboutYes.addEventListener('click', ()=>{
    s.messAboutPick = mtPickMessAboutPick();
    mtGoTo('messAboutAfter');
  });
  const messaboutNo = container.querySelector('[data-action="messabout-no"]');
  if(messaboutNo) messaboutNo.addEventListener('click', ()=> mtGoTo('talkAboutIt'));
  const messaboutAnother = container.querySelector('[data-action="messabout-another"]');
  if(messaboutAnother) messaboutAnother.addEventListener('click', ()=>{
    s.messAboutPick = mtPickMessAboutPick();
    // already on messAboutAfter -- mtRender tears down the previous embedded game (if any)
    // and activates the new pick, no special-casing needed here.
    mtRender();
  });
  const messaboutReady = container.querySelector('[data-action="messabout-ready"]');
  if(messaboutReady) messaboutReady.addEventListener('click', ()=> mtGoTo('talkAboutIt'));

  const backToSubpicker = container.querySelector('[data-action="back-to-subpicker"]');
  if(backToSubpicker) backToSubpicker.addEventListener('click', ()=> mtGoTo('subpicker'));
  const backToTalk = container.querySelector('[data-action="back-to-talk"]');
  if(backToTalk) backToTalk.addEventListener('click', ()=> mtGoTo('talkAboutIt'));
  const backToSituation = container.querySelector('[data-action="back-to-situation"]');
  if(backToSituation) backToSituation.addEventListener('click', ()=> mtGoTo('situation'));
  const backToThought = container.querySelector('[data-action="back-to-thought"]');
  if(backToThought) backToThought.addEventListener('click', ()=> mtGoTo('thought'));
  const backToActionAsked = container.querySelector('[data-action="back-to-actionAsked"]');
  if(backToActionAsked) backToActionAsked.addEventListener('click', ()=> mtGoTo('actionAsked'));

  const talkYes = container.querySelector('[data-action="talk-yes"]');
  if(talkYes) talkYes.addEventListener('click', ()=> mtGoTo('situation'));
  const talkNo = container.querySelector('[data-action="talk-no"]');
  if(talkNo) talkNo.addEventListener('click', ()=> mtGoTo('declined'));

  const nextSituation = container.querySelector('[data-action="next-situation"]');
  if(nextSituation) nextSituation.addEventListener('click', ()=>{
    s.situation = container.querySelector('#mtInput').value;
    mtGoTo('thought');
  });
  const nextThought = container.querySelector('[data-action="next-thought"]');
  if(nextThought) nextThought.addEventListener('click', ()=>{
    s.thought = container.querySelector('#mtInput').value;
    mtGoTo('actionAsked');
  });
  const actionYes = container.querySelector('[data-action="action-yes"]');
  if(actionYes) actionYes.addEventListener('click', ()=>{ s.actionTaken = true; mtGoTo('actionDescription'); });
  const actionNo = container.querySelector('[data-action="action-no"]');
  if(actionNo) actionNo.addEventListener('click', ()=>{ s.actionTaken = false; mtAfterAction(); });
  const nextChannelPositivity = container.querySelector('[data-action="next-channelPositivity"]');
  if(nextChannelPositivity) nextChannelPositivity.addEventListener('click', ()=>{
    s.actionDescription = container.querySelector('#mtInput').value;
    mtGoTo('closing');
  });
  const nextActionDescription = container.querySelector('[data-action="next-actionDescription"]');
  if(nextActionDescription) nextActionDescription.addEventListener('click', ()=>{
    s.actionDescription = container.querySelector('#mtInput').value;
    mtAfterAction();
  });
  const nextResolution = container.querySelector('[data-action="next-resolution"]');
  if(nextResolution) nextResolution.addEventListener('click', ()=>{
    s.resolution = container.querySelector('#mtInput').value;
    mtGoTo('closing');
  });

  const comfortYes = container.querySelector('[data-action="comfort-yes"]');
  if(comfortYes) comfortYes.addEventListener('click', ()=> mtGoTo('comfortChoice'));
  const comfortNo = container.querySelector('[data-action="comfort-no"]');
  if(comfortNo) comfortNo.addEventListener('click', ()=> mtGoTo('comfortDeclined'));

  // Filtered to the curated "comfort" pools above -- deliberately not the full site pool,
  // per direct request, since a random pick site-wide could just as easily hand someone
  // something heavy right when they're already down.
  const comfortRead = container.querySelector('[data-action="comfort-read"]');
  if(comfortRead) comfortRead.addEventListener('click', ()=>{
    const pool = DISPATCHES.filter(d => MT_COMFORT_DISPATCH_URLS.includes(d.url));
    if(pool.length === 0) return;
    const pick = pool[Math.floor(Math.random() * pool.length)];

  });
  const comfortDo = container.querySelector('[data-action="comfort-do"]');
  if(comfortDo) comfortDo.addEventListener('click', ()=>{
    const pool = EXPLORE_SITES.filter(s2 => MT_COMFORT_INSTRUMENT_URLS.includes(s2.url));

function showUploadToast(toastEl, message){
  if(!toastEl) return;
  toastEl.textContent = message;
  toastEl.classList.add('active');
  clearTimeout(toastEl._hideTimer);
  toastEl._hideTimer = setTimeout(()=> toastEl.classList.remove('active'), 3200);
}
function wirePhotoUpload(container){
  const fab = container.querySelector('#photoUploadFab');
  const input = container.querySelector('#photoUploadInput');
  const toast = container.querySelector('#uploadToast');
  if(!fab || !input) return;
  fab.addEventListener('click', ()=> input.click());
  input.addEventListener('change', async ()=>{
    const file = input.files && input.files[0];
    input.value = '';
    if(!file) return;
    if(!supabaseClient){
      showUploadToast(toast, "Upload isn't available right now.");
      return;
    }
    if(!file.type || !file.type.startsWith('image/')){
      showUploadToast(toast, "Please choose an image file.");
      return;
    }
    if(file.size > 10 * 1024 * 1024){
      showUploadToast(toast, "That photo's a bit large — try one under 10MB.");
      return;
    }
    fab.disabled = true;
    fab.classList.add('uploading');
    try{
      const rawExt = (file.name.split('.').pop() || 'jpg').toLowerCase();
      const ext = /^[a-z0-9]{1,5}$/.test(rawExt) ? rawExt : 'jpg';
      const path = `pending/${Date.now()}-${Math.random().toString(36).slice(2,8)}.${ext}`;
      const { error } = await supabaseClient.storage.from(SUPABASE_BUCKET).upload(path, file, { contentType: file.type });
      if(error) throw error;
      showUploadToast(toast, "Sent for review — thanks! 📸");
    }catch(e){
      showUploadToast(toast, "Upload failed — check your connection and try again.");
    }finally{
      fab.disabled = false;
      fab.classList.remove('uploading');
    }
  });
}
async function loadSubmittedPhotos(){

function wirePhotoLightbox(container){
  const lightbox = container.querySelector('#photoLightbox');
  const track = container.querySelector('#lightboxTrack');
  const closeBtn = container.querySelector('#lightboxClose');
  if(!lightbox || !track) return;
  let currentIndex = 0;
  function loadNearby(idx){
    // Only the current slide plus one on each side ever get a real src --
    // this is the actual fix for photos loading slowly: previously every
    // photo in the whole library requested at once when the lightbox opened.
    for(let i = Math.max(0, idx - 1); i <= Math.min(track.children.length - 1, idx + 1); i++){
      const img = track.children[i] && track.children[i].querySelector('img');
      if(img && img.dataset.src){
        img.src = img.dataset.src;
        delete img.dataset.src;
      }
    }
  }
  function openAt(idx){
    currentIndex = idx;
    lightbox.classList.add('active');
    document.body.style.overflow = 'hidden';
    loadNearby(idx);
    const slide = track.children[idx];
    if(slide) slide.scrollIntoView({ block:'nearest', inline:'center' });
  }
  function closeLightbox(){
    lightbox.classList.remove('active');
    document.body.style.overflow = '';
  }
  function goToSlide(idx){
    const clamped = Math.max(0, Math.min(track.children.length - 1, idx));
    currentIndex = clamped;
    loadNearby(clamped);
    const slide = track.children[clamped];
    if(slide) slide.scrollIntoView({ block:'nearest', inline:'center', behavior:'smooth' });
  }
  container.querySelectorAll('.photo-item').forEach(btn=>{
    btn.addEventListener('click', ()=> openAt(parseInt(btn.dataset.index, 10)));
  });
  closeBtn.addEventListener('click', closeLightbox);
  lightbox.addEventListener('click', (e)=>{ if(e.target === lightbox) closeLightbox(); });

  // Real bug found and fixed: this lightbox had NO keyboard handling at all --
  // not arrow keys, not space, not even Escape (the earlier global Escape
  // handler covers stories/popups/Arsenal detail but was never extended to
  // this lightbox, since it was built with its own separate open/close
  // functions). Scoped to only act while this specific lightbox is open, so
  // it doesn't interfere with keyboard use elsewhere on the page.
  document.addEventListener('keydown', (e)=>{
    if(!lightbox.classList.contains('active')) return;
    if(e.key === 'Escape'){ e.preventDefault(); closeLightbox(); }
    else if(e.key === 'ArrowRight' || e.key === ' ' || e.key === 'Spacebar'){ e.preventDefault(); goToSlide(currentIndex + 1); }
    else if(e.key === 'ArrowLeft'){ e.preventDefault(); goToSlide(currentIndex - 1); }
  });

  let touchStartY = 0, touchStartX = 0, touching = false;
  lightbox.addEventListener('touchstart', (e)=>{
    if(e.touches.length !== 1) return;
    touchStartY = e.touches[0].clientY;
    touchStartX = e.touches[0].clientX;
    touching = true;
  }, { passive:true });
  lightbox.addEventListener('touchend', (e)=>{
    if(!touching) return;
    touching = false;
    const dy = e.changedTouches[0].clientY - touchStartY;
    const dx = e.changedTouches[0].clientX - touchStartX;
    if(Math.abs(dy) > 70 && Math.abs(dy) > Math.abs(dx)){
      closeLightbox();
    }
  }, { passive:true });
}

// Buckets events into the rolling 7-day window: today + next 6 days. An event
// already in progress (startDate in the past, endDate still upcoming) is
// pinned to "today" rather than disappearing. This is recomputed fresh from
// the current date on every render, so the window rolls forward on its own
// every 24 hours -- no separate "refresh" logic needed.
function tashkentEventsWindow(){
  const now = new Date();
  const startOfToday = new Date(now.getFullYear(), now.getMonth(), now.getDate());
  const buckets = [];
  for(let i=0;i<8;i++){
    const d = new Date(startOfToday);
    d.setDate(d.getDate()+i);
    buckets.push({ date: d, events: [] });
  }
  const windowEnd = buckets[7].date;

  EVENTS_TASHKENT.forEach(e=>{
    const m = (e.startDate||'').match(/^(\d{4})-(\d{2})-(\d{2})$/);
    if(!m) return;
    const start = new Date(+m[1], +m[2]-1, +m[3]);
    let end = start;
    if(e.endDate){
      const m2 = e.endDate.match(/^(\d{4})-(\d{2})-(\d{2})$/);
      if(m2) end = new Date(+m2[1], +m2[2]-1, +m2[3]);
    }
    if(end < startOfToday) return;       // already finished
    if(start > windowEnd) return;         // too far in the future
    const displayDate = start < startOfToday ? startOfToday : start;
    const dayIndex = Math.round((displayDate - startOfToday) / 86400000);
    if(dayIndex >= 0 && dayIndex < 8){
      buckets[dayIndex].events.push(e);
    }
  });
  return buckets;
}

// Same rolling-window logic as Tashkent events, applied to the dated pool only.
function virtualEventsDatedWindow(){
  const now = new Date();
  const startOfToday = new Date(now.getFullYear(), now.getMonth(), now.getDate());
  const windowEnd = new Date(startOfToday);
  windowEnd.setDate(windowEnd.getDate() + 7);
  return VIRTUAL_EVENTS.dated.filter(e=>{
    const m = (e.startDate||'').match(/^(\d{4})-(\d{2})-(\d{2})$/);
    if(!m) return false;
    const d = new Date(+m[1], +m[2]-1, +m[3]);
    return d >= startOfToday && d <= windowEnd;
  }).sort((a,b)=> a.startDate.localeCompare(b.startDate));
}

// Standing format for all short dates on the site: "19 Aug" -- no year, no leading zero.
function formatShortDate(dateStr){
  const m = (dateStr||'').match(/^(\d{4})-(\d{2})-(\d{2})$/);
  if(!m) return dateStr;
  const monthNames = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  return `${+m[3]} ${monthNames[+m[2]-1]}`;
}

function upcomingBirthdayTileHtml(){
  if(BIRTHDAYS.length===0){
    return '<a class="bday-tile-card" href="#birthdays"><div class="empty-card" style="margin:0;">No birthdays yet. Nobody\'s been born apparently.</div></a>';
  }
  const today = new Date();
  const todayM = today.getMonth()+1, todayD = today.getDate();
  const todays = BIRTHDAYS.filter(b => b.month===todayM && b.day===todayD);
  if(todays.length > 0){
    return `<a class="bday-tile-card today" href="#birthdays">
      ${todays.map(b => `<span class="bday-tile-name bday-trigger" data-name="${escapeHtml(b.name)}">🎉 It's ${escapeHtml(b.name)}'s birthday today!</span>`).join('')}
    </a>`;
  }
  const withNext = BIRTHDAYS.map(b=>{
    let next = new Date(today.getFullYear(), b.month-1, b.day);
    if(next < new Date(today.getFullYear(), todayM-1, todayD)){
      next = new Date(today.getFullYear()+1, b.month-1, b.day);
    }
    return {...b, next};
  }).sort((a,b)=> a.next - b.next);

  // Show everyone whose birthday falls within the next 3 days, not just the single soonest.
  // If nobody's that close, fall back to just the next one coming up so the tile isn't empty.
  const startOfToday = new Date(today.getFullYear(), todayM-1, todayD);
  const threeDaysOut = new Date(startOfToday);
  threeDaysOut.setDate(threeDaysOut.getDate() + 3);
  const withinThreeDays = withNext.filter(b => b.next <= threeDaysOut);
  const toShow = withinThreeDays.length > 0 ? withinThreeDays : [withNext[0]];

  const rows = toShow.map(b => {
    const dd = String(b.day).padStart(2,'0');
    const mm = String(b.month).padStart(2,'0');
    return `<span class="bday-tile-name">${escapeHtml(b.name)}, ${dd}/${mm}</span>`;
  }).join('');
  return `<a class="bday-tile-card" href="#birthdays">
    <span class="bday-tile-label">Upcoming</span>
    ${rows}
  </a>`;
}
function birthdaysHtml(){
  if(BIRTHDAYS.length===0){
    return '<div class="empty-card">No birthdays yet. Nobody\'s been born apparently.</div>';
  }
  const today = new Date();
  const todayM = today.getMonth()+1, todayD = today.getDate();
  const todayDD = String(todayD).padStart(2,'0');
  const todayMM = String(todayM).padStart(2,'0');
  const withNext = BIRTHDAYS.map(b=>{
    let next = new Date(today.getFullYear(), b.month-1, b.day);
    if(next < new Date(today.getFullYear(), todayM-1, todayD)){
      next = new Date(today.getFullYear()+1, b.month-1, b.day);
    }
    return {...b, next};
  }).sort((a,b)=> a.next - b.next);
  const rows = withNext.map(b=>{
    const isToday = b.month===todayM && b.day===todayD;
    const dd = String(b.day).padStart(2,'0');
    const mm = String(b.month).padStart(2,'0');
    const nameHtml = isToday
      ? `<span class="bday-name bday-trigger" data-name="${escapeHtml(b.name)}">${escapeHtml(b.name)} 🎉</span>`
      : `<span class="bday-name">${escapeHtml(b.name)}</span>`;
    return `<div class="bday-item ${isToday?'today':''}">
      ${nameHtml}
      <span class="bday-date">${dd}/${mm}</span>
    </div>`;
  }).join('');
  return `
    <div class="bday-today-banner">Today is ${todayDD}/${todayMM}</div>
    <div class="bday-list">${rows}</div>
  `;
}

/* ---- Swipe right to go back to Home — wired once; only acts when Home was the previous page ---- */
let cameFromHome = false;
function wireSwipeBackToHome(container){
  let startX = 0, startY = 0, tracking = false;
  container.addEventListener('touchstart', (e)=>{
    if(e.touches.length !== 1) return;
    if(e.target.closest && e.target.closest('#photoLightbox.active')) return;
    startX = e.touches[0].clientX;
    startY = e.touches[0].clientY;
    tracking = true;
  }, { passive:true });
  container.addEventListener('touchend', (e)=>{
    if(!tracking) return;
    tracking = false;
    if(!cameFromHome) return;
    const hereNow = location.hash.replace(/^#/, '');
    if(hereNow === '') return; // already home
    const dx = e.changedTouches[0].clientX - startX;
    const dy = e.changedTouches[0].clientY - startY;
    // Left-to-right swipe only (dx positive), not up/down, not the reverse direction.
    if(dx > 60 && dx > Math.abs(dy) * 1.2){
      location.hash = '#';
    }
  }, { passive:true });
}

let lastRenderedHash = null;
function getScrollMemory(){
  try{ return JSON.parse(sessionStorage.getItem('scrollMemory') || '{}'); }catch(e){ return {}; }
}
function saveScrollMemory(mem){
  try{ sessionStorage.setItem('scrollMemory', JSON.stringify(mem)); }catch(e){}
}
// Every previous attempt at this (CSS touch-action/overscroll-behavior, then a history
// "trap" that re-plants a duplicate entry on every popstate) failed on a real installed
// home-screen app: confirmed by W3C's own open issue on this exact problem -- iOS's
// standalone-web-app swipe-back gesture is a native WebKit gesture that doesn't reliably
// go through JS-observable history events in time for any script to intervene. There is
// no documented, working fix for that specific gesture from web content alone.
//
// This takes a different approach entirely: Mind Temple and the arcade route NEVER touch
// location.hash or the History API at all, in either direction. Opening either one just
// swaps the visible content via mtOverlayParts, a plain in-memory variable -- the URL bar
// and browser history stay exactly as they were on whatever page was open before. Since
// nothing new was ever added to history, a swipe-back gesture has nothing to navigate to
// in the first place; it can't leave Mind Temple because Mind Temple never became a
// separate "page" as far as the browser is concerned. Exiting through the real "Back to
// Mr Eric's Lounge" link/button still works completely normally, since that's handled by
// mtCloseOverlay() below, not by touching the URL.
// Trade-off, stated plainly: Mind Temple can no longer be deep-linked or refreshed into
// directly (refreshing the page while it's open just shows the page underneath) -- that's
// the real cost of guaranteeing the swipe gesture has nothing to grab onto.
let mtOverlayParts = null;
function mtOpenOverlay(parts){
  mtOverlayParts = parts;
  renderRoute();
}
function mtCloseOverlay(){
  mtOverlayParts = null;
  renderRoute();
}
document.addEventListener('click', (e) => {
  const exitLink = e.target.closest('[data-mt-exit]');
  if(exitLink){
    e.preventDefault();
    mtExit();
    return;
  }
  const link = e.target.closest('a[href]');
  if(!link) return;
  const href = link.getAttribute('href');
  if(!href) return;
  if(href === '#mind-temple'){
    e.preventDefault();
    mtOpenOverlay(['mind-temple']);
    return;
  }
  if(href.indexOf('#arcade/') === 0){
    e.preventDefault();
    mtOpenOverlay(['arcade', href.slice('#arcade/'.length)]);
    return;
  }
});

function renderRoute(opts){
  opts = (opts && typeof opts === 'object' && !(opts instanceof Event)) ? opts : {};
  const app = document.getElementById('app');
  const hash = location.hash.replace(/^#/, '');
  const parts = mtOverlayParts ? mtOverlayParts : hash.split('/').filter(Boolean);
  logEvent('view', hash || 'home');

  // Safety net: if an embedded game (Mind Temple's mess-about panel, or the standalone
  // arcade route) was left mounted and the user navigated away by some route OTHER than
  // its own exit button -- tapping a bottom-tab, following a link, hitting back -- its
  // requestAnimationFrame loop would otherwise keep running forever on a canvas that's no
  // longer even in the DOM. Every route change tears it down here, regardless of cause.
  if(mtActiveEmbeddedCleanup){ mtActiveEmbeddedCleanup(); mtActiveEmbeddedCleanup = null; }

  // Scoped ONLY to Mind Temple and the arcade route -- everywhere else on the site keeps
  // completely normal swipe/scroll behavior. See mtOpenOverlay/mtCloseOverlay above for
  // the actual fix (the URL never changes while either is open, so there's nothing for a
  // swipe-back gesture to navigate to). This CSS class is now just a harmless
  // supplementary layer.
  const noSwipeBackRoute = parts[0] === 'mind-temple' || parts[0] === 'arcade';
  document.documentElement.classList.toggle('mt-no-swipeback', noSwipeBackRoute);
  document.body.classList.toggle('mt-no-swipeback', noSwipeBackRoute);

  // Remember where we were scrolled to on the page we're about to leave.
  if(!opts.forceTop && lastRenderedHash !== null){
    const mem = getScrollMemory();
    mem[lastRenderedHash] = window.scrollY;
    saveScrollMemory(mem);
  }

  let html;
  if(parts.length === 0){
    html = viewHome();
  } else if(parts[0] === 'faculty' && parts[1]){
    html = viewFaculty(parts[1]);
    if(parts[1] !== 'all') trackFacultyVisit(parts[1]);
  } else if(parts[0] === 'watch' && parts[1]){
    html = viewWatchFaculty(parts[1]);
  } else if(parts[0] === 'play' && parts[1]){

    html = viewPhotos();

    html = viewSaved();

  } else if(parts[0] === 'arcade' && parts[1]){
    html = viewArcade(parts[1]);
  } else if(parts[0] === 'explore'){
    html = viewExplore();
  } else if(parts[0] === 'invite'){

    html = viewInstall();

    html = viewStats();

    html = viewSuperstars();

    html = viewSports();
  } else if(parts[0] === 'sports' && parts[1] === 'league' && parts[2]){
    html = viewLeagueDetail(parts[2]);
  } else if(parts[0] === 'sports'){
    html = viewSportsHub();
  } else {
    html = viewHome();
  }

  app.innerHTML = html;
  app.classList.remove('route-fade');
  void app.offsetWidth; // force reflow so the animation replays every time, not just once
  app.classList.add('route-fade');
  document.body.classList.toggle('theme-watch', parts[0] === 'watch' || parts[0] === 'play');
  document.body.classList.add('show-bottom-tabs');
  wireWatchButtons(app);
  wireEntryActions(app);
  if(parts[0] === 'photos'){ wirePhotoLightbox(app); wirePhotoUpload(app); loadSubmittedPhotos(); }
  if(parts[0] === 'search'){ wireSearch(app); loadTashkentEvents(); loadVirtualEvents(); }
  if(parts[0] === 'saved'){
    const savedWords = getBookmarks().filter(b => b.type === 'word');
    app.querySelectorAll('#savedWordsContainer .dict-card').forEach((cardEl, i) => {
      if(savedWords[i]) wireDictCard(cardEl, savedWords[i]);
    });
  }
  if(parts[0] === 'mind-temple'){ mtInit(); }
  if(parts[0] === 'arcade' && parts[1]){ wireArcade(parts[1]); }
  if(parts[0] === 'install'){ wireInstallPage(); }
  if(parts[0] === 'stats'){ loadStats(); }
  if(parts[0] === 'events-tashkent'){ loadTashkentEvents(); }
  if(parts[0] === 'invite'){ wireNativeShareButton(); }

  if(parts.length === 0){ loadOnThisDay(); loadWeather(); loadVoxPopuli(); loadLiveSportsData(); wireRandomButton(app); wireRandomVideoButton(app); wireRandomExploreButton(app); wireExtrasCarousel(app); checkAchievements(); renderStreakBadge(); checkNewBadges(); updateStoryRings(); }
  if(parts[0] === 'sports' && parts[1] === 'tables'){ loadLiveSportsData(); }
  if(parts[0] === 'arsenal'){ loadLiveSportsData(); loadGoalResults(); }
  if(parts[0] === 'sports' && parts[1] === 'league' && parts[2]){ loadLiveSportsData(); loadGoalResults(); }

  // Swipe right to go back — only when the page we arrived from was Home itself.
  cameFromHome = (lastRenderedHash === '');

  // Restore the scroll position we were at last time we visited this page,
  // or start at the top if we've never been here this session — unless a
  // forced refresh (Home tab tap while already home, or pull-to-refresh)
  // asked us to just go to the top regardless.
  const scrollMem = getScrollMemory();
  let savedY;
  if(opts.forceTop){
    savedY = 0;
    scrollMem[hash] = 0;
    saveScrollMemory(scrollMem);
  } else {
    savedY = scrollMem[hash];
  }
  requestAnimationFrame(()=> window.scrollTo(0, savedY !== undefined ? savedY : 0));
  lastRenderedHash = hash;
}

/* ---- Dark mode ---- */
(function(){
  const toggle = document.getElementById('darkModeToggle');
  const SUN_SVG = '<svg width="18" height="18" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.8" fill="none" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4.5"/><path d="M12 2v3M12 19v3M4.2 4.2l2.1 2.1M17.7 17.7l2.1 2.1M2 12h3M19 12h3M4.2 19.8l2.1-2.1M17.7 6.3l2.1-2.1"/></svg>';
  const MOON_SVG = '<svg width="18" height="18" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.8" fill="none" stroke-linecap="round" stroke-linejoin="round"><path d="M20 14.5A8.5 8.5 0 1 1 9.5 4a7 7 0 0 0 10.5 10.5Z"/></svg>';
  const saved = (()=>{ try{ return localStorage.getItem('darkMode'); }catch(e){ return null; } })();
  if(saved === '1'){
    document.body.classList.add('dark-mode');
    toggle.innerHTML = SUN_SVG;
  }

  const prefersReducedMotion = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  let animating = false;
  let breakClickCount = 0;
  const root = document.documentElement;

  toggle.addEventListener('click', ()=>{
    breakClickCount++;
    if(breakClickCount === 4){
      triggerBrokenEgg();
      return;
    }
    if(animating) return;
    const goingDark = !document.body.classList.contains('dark-mode');

    if(prefersReducedMotion){
      document.body.classList.toggle('dark-mode', goingDark);
      toggle.innerHTML = goingDark ? SUN_SVG : MOON_SVG;
      try{ localStorage.setItem('darkMode', goingDark ? '1' : '0'); }catch(e){}
      return;
    }

    // Every element with a background/text/border color that depends on the theme is
    // already wired to transition over --theme-fade (see the CSS). Bump that to 5s
    // FIRST, force the browser to register it, THEN flip the class one frame later —
    // otherwise both changes land in the same tick and the transition never engages.
    animating = true;
    root.style.setProperty('--theme-fade', '5s');
    void root.offsetWidth; // force reflow so the new duration is committed
    requestAnimationFrame(()=>{
      document.body.classList.toggle('dark-mode', goingDark);
      toggle.innerHTML = goingDark ? SUN_SVG : MOON_SVG;
      try{ localStorage.setItem('darkMode', goingDark ? '1' : '0'); }catch(e){}
    });

    setTimeout(()=>{
      root.style.setProperty('--theme-fade', '.25s');
      animating = false;
    }, 5100);
  });
})();

function showEasterEggPopup(text, duration){
  const overlay = document.createElement('div');
  overlay.dataset.eggPopup = 'true';
  overlay.style.cssText = 'position:fixed;inset:0;display:flex;align-items:center;justify-content:center;z-index:10002;pointer-events:none;padding:0 30px;';
  const box = document.createElement('div');
  box.textContent = text;
  box.style.cssText = 'background:var(--ink-solid);color:#fff;padding:20px 26px;border-radius:18px;font-family:"Baloo 2",sans-serif;font-weight:700;font-size:19px;text-align:center;max-width:100%;box-shadow:0 8px 24px rgba(0,0,0,.35);opacity:0;transition:opacity .3s;pointer-events:auto;cursor:pointer;touch-action:none;';
  overlay.appendChild(box);
  document.body.appendChild(overlay);
  requestAnimationFrame(()=>{ box.style.opacity = '1'; });

  let dismissed = false;
  const autoTimer = setTimeout(()=> dismiss(), duration - 400);
  function dismiss(flyX, flyY){
    if(dismissed) return;
    dismissed = true;
    clearTimeout(autoTimer);
    box.style.transition = 'transform .22s ease, opacity .22s ease';
    box.style.transform = flyX !== undefined ? `translate(${flyX}px, ${flyY}px)` : 'none';
    box.style.opacity = '0';
    setTimeout(()=> overlay.remove(), flyX !== undefined ? 220 : 400);
  }

  // Swipe away in any direction — up, down, left, right — to dismiss early.
  let startX = 0, startY = 0, dragging = false;
  box.addEventListener('touchstart', (e)=>{
    startX = e.touches[0].clientX; startY = e.touches[0].clientY; dragging = true;
    box.style.transition = 'none';
  }, { passive:true });
  box.addEventListener('touchmove', (e)=>{
    if(!dragging) return;
    const dx = e.touches[0].clientX - startX;
    const dy = e.touches[0].clientY - startY;
    box.style.transform = `translate(${dx}px, ${dy}px)`;
    box.style.opacity = String(Math.max(0.3, 1 - Math.hypot(dx,dy)/300));
  }, { passive:true });
  box.addEventListener('touchend', (e)=>{
    if(!dragging) return;
    dragging = false;
    const dx = e.changedTouches[0].clientX - startX;
    const dy = e.changedTouches[0].clientY - startY;
    const dist = Math.hypot(dx, dy);
    if(dist > 40){
      const scale = 500 / (dist || 1);
      dismiss(dx*scale, dy*scale);
    } else {
      box.style.transition = 'transform .2s ease, opacity .2s ease';
      box.style.transform = 'translate(0,0)';
      box.style.opacity = '1';
    }
  });
  // Tap also dismisses, for anyone on a mouse rather than touch.
  box.addEventListener('click', ()=> dismiss(0, -80));
}

/* ---- Logo tile colors: cycle through the full site palette so the mosaic logo pulses
   through every domain and misc-page color over time, rather than sitting on 5 fixed
   colors forever. Each tile has its own interval matched to its own pulse-scale animation
   duration (already staggered in CSS: 3.8s/3.2s/4.1s/3.5s/3.0s) so the color shift lands
   roughly on the same beat as the shape pulse, feeling like one integrated animation
   rather than two unrelated things happening on top of each other. Colors fade via CSS
   transition (see .tile-logo span) rather than snapping, for the "flow gently" effect. */
(function(){
  const LOGO_PALETTE = [
    '#334247','#495C83','#3F425F','#516E9E', // Serious/Institutional
    '#4C2F7F','#6C388A','#85389F', // Modern/Technical
    '#1C2554','#2E6B8A','#47B8B8','#2E7664', // Blue-dominant Science
    '#933978','#5A3F30','#337231','#B67C2B', // Human/warm
    '#C22E32', // Languages
    '#74253F','#C5C936','#596534','#2B824B','#A63061', // misc pages
  ];
  const prefersReducedMotion = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  const tiles = [
    { el: document.querySelector('.tile-logo .tl-1'), duration: 3800 },
    { el: document.querySelector('.tile-logo .tl-2'), duration: 3200 },
    { el: document.querySelector('.tile-logo .tl-3'), duration: 4100 },
    { el: document.querySelector('.tile-logo .tl-4'), duration: 3500 },
    { el: document.querySelector('.tile-logo .tl-5'), duration: 3000 },
  ];
  function randomColorExcluding(last){
    let c;
    do{ c = LOGO_PALETTE[Math.floor(Math.random() * LOGO_PALETTE.length)]; }while(c === last && LOGO_PALETTE.length > 1);
    return c;
  }
  tiles.forEach(t => {
    if(!t.el) return;
    let last = randomColorExcluding(null);
    t.el.style.background = last;
    if(prefersReducedMotion) return; // static color, no cycling, respects the OS setting
    setInterval(() => {
      last = randomColorExcluding(last);
      t.el.style.background = last;
    }, t.duration);
  });
})();

/* ---- Pull to refresh (Instagram/Twitter style) ---- */
(function(){
  const THRESHOLD = 70;
  const indicator = document.getElementById('pullRefresh');
  let startY = 0, pulling = false, currentPull = 0, refreshing = false;

  function setPull(px){
    currentPull = px;
    const clamped = Math.min(px, THRESHOLD * 1.4);
    indicator.style.transform = `translateY(${clamped - 60}px)`;
    indicator.classList.toggle('ready', px >= THRESHOLD);
  }

  document.addEventListener('touchstart', (e)=>{
    if(refreshing || e.touches.length !== 1 || window.scrollY > 0) return;
    startY = e.touches[0].clientY;
    pulling = true;
  }, { passive:true });

  document.addEventListener('touchmove', (e)=>{
    if(!pulling || refreshing) return;
    const dy = e.touches[0].clientY - startY;
    if(dy <= 0 || window.scrollY > 0){ pulling = false; setPull(0); return; }
    setPull(dy * 0.5); // resistance, matches the native feel
  }, { passive:true });

  document.addEventListener('touchend', ()=>{
    if(!pulling || refreshing){ pulling = false; return; }
    pulling = false;
    if(currentPull >= THRESHOLD){
      refreshing = true;
      indicator.classList.add('spinning');
      indicator.style.transform = 'translateY(14px)';
      setTimeout(()=>{
        renderRoute({ forceTop:true });
        setTimeout(()=>{
          indicator.classList.remove('spinning','ready');
          indicator.style.transform = '';
          refreshing = false;
        }, 450);
      }, 300);
    } else {
      setPull(0);
    }
  }, { passive:true });
})();

function shuffleCities(arr){
  const a = arr.slice();
  for(let i = a.length - 1; i > 0; i--){
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

// Freshly reshuffled every page load, per spec -- a new random traversal order
// each time, but every capital is shown once before any repeat within that load.
let clockCityQueue = shuffleCities(CAPITAL_CITIES);
let clockCityIndex = 0;
let clockActiveCity = null; // null = default Tashkent/device-local time

function updateClockLabel(){
  const labelEl = document.querySelector('.board-cell .label');
  if(!labelEl) return;
  if(!clockActiveCity){
    labelEl.classList.remove('label-city-mode');
    labelEl.textContent = 'Local time';
    return;
  }
  const combined = `${clockActiveCity.city}, ${clockActiveCity.country}`;
  if(combined.length > 20){
    labelEl.classList.add('label-city-mode');
    labelEl.innerHTML = `<span class="label-city">${escapeHtml(clockActiveCity.city)}</span><span class="label-country">${escapeHtml(clockActiveCity.country)}</span>`;
  } else {
    labelEl.classList.remove('label-city-mode');
    labelEl.textContent = combined;
  }
}

let clockLastTapTime = 0;
function wireClockTapCycling(){
  const clockEl = document.getElementById('clock');
  const cell = clockEl && clockEl.closest('.board-cell');
  if(!cell) return;
  cell.style.cursor = 'pointer';
  cell.addEventListener('click', ()=>{
    const now = Date.now();
    const isDoubleTap = (now - clockLastTapTime) < 350;
    clockLastTapTime = now;
    if(isDoubleTap){
      clockActiveCity = null;
    } else {
      clockActiveCity = clockCityQueue[clockCityIndex];
      clockCityIndex++;
      if(clockCityIndex >= clockCityQueue.length){
        clockCityIndex = 0;
        clockCityQueue = shuffleCities(CAPITAL_CITIES);
      }
    }
    updateClockLabel();
    updateClock();
  });
}

function updateClock(){
  const now = new Date();
  if(clockActiveCity){
    const parts = new Intl.DateTimeFormat('en-GB', {
      timeZone: clockActiveCity.tz,
      hour:'2-digit', minute:'2-digit', second:'2-digit',
      day:'2-digit', month:'2-digit', year:'numeric', hour12:false,
    }).formatToParts(now);
    const get = t => (parts.find(p=>p.type===t) || {}).value || '--';
    document.getElementById('clock').textContent = `${get('hour')}:${get('minute')}:${get('second')}`;
    document.getElementById('clockDate').textContent = `${get('day')}/${get('month')}/${get('year')}`;
    return;
  }
  document.getElementById('clock').textContent =
    `${pad(now.getHours())}:${pad(now.getMinutes())}:${pad(now.getSeconds())}`;
  document.getElementById('clockDate').textContent =
    `${pad(now.getDate())}/${pad(now.getMonth()+1)}/${now.getFullYear()}`;
}

/* ---- Weekend countdown ---- */
function isWeekendNow(now){
  const day = now.getDay();
  if(day === 5) return now.getHours() >= 18;
  return day === 6 || day === 0;
}
function nextFridayEighteen(now){
  const d = new Date(now);
  d.setHours(18,0,0,0);
  const day = d.getDay();
  let diffDays = (5 - day + 7) % 7;
  if(diffDays === 0 && now.getTime() > d.getTime()){ diffDays = 7; }
  d.setDate(d.getDate() + diffDays);
  return d;
}
function updateWeekendCountdown(){
  if(window._weekendEggPlaying) return;
  const now = new Date();
  const el = document.getElementById('weekendCountdown');
  if(isWeekendNow(now)){
    el.textContent = "it's here 🎉";
    try{
      if(!sessionStorage.getItem('weekendCelebrated')){
        sessionStorage.setItem('weekendCelebrated', '1');
        burstConfetti();
        showToast("🎉 WEEKEND. Go outside. Or don't.");
      }
    }catch(e){}
    return;
  }
  const target = nextFridayEighteen(now);
  let diff = Math.max(0, target - now);
  const dd = Math.floor(diff / 86400000); diff -= dd*86400000;
  const hh = Math.floor(diff / 3600000); diff -= hh*3600000;
  const mm = Math.floor(diff / 60000); diff -= mm*60000;
  const ss = Math.floor(diff / 1000);
  el.textContent = `${pad(dd)}:${pad(hh)}:${pad(mm)}:${pad(ss)}`;
}

function updateArsenalCountdown(){

  const hh = Math.floor(diff / 3600000); diff -= hh*3600000;
  const mm = Math.floor(diff / 60000); diff -= mm*60000;
  const ss = Math.floor(diff / 1000);
  el.textContent = `${pad(dd)}:${pad(hh)}:${pad(mm)}:${pad(ss)}`;
}

(function(){
  const TILT_SELECTOR = '.fac-tile, .events-tile, .bday-tile-card, .books-tile, ' +
    '.explore-card, .explore-tile, .goodnews-tile, .otd-card, .photo-tile, ' +
    '.random-tile, .sotw-card, .sport-hub-tile, .sports-card, .sports-tile, ' +
    '.watch-card, .watch-tile';
  const MAX_TILT_DEG = 8;
  let activeTile = null;

  function applyTilt(el, clientX, clientY){
    const rect = el.getBoundingClientRect();
    const px = (clientX - rect.left) / rect.width;
    const py = (clientY - rect.top) / rect.height;
    const rotateY = (px - 0.5) * MAX_TILT_DEG * 2;
    const rotateX = (0.5 - py) * MAX_TILT_DEG * 2;
    el.style.transform = `perspective(600px) rotateX(${rotateX.toFixed(2)}deg) rotateY(${rotateY.toFixed(2)}deg) scale(1.02)`;
  }
  function resetTilt(el){
    if(!el) return;
    el.style.transform = '';
  }

  document.body.addEventListener('pointerdown', (e)=>{
    const tile = e.target.closest(TILT_SELECTOR);
    if(!tile) return;
    activeTile = tile;
    applyTilt(tile, e.clientX, e.clientY);
  });
  document.body.addEventListener('pointermove', (e)=>{
    if(!activeTile) return;
    applyTilt(activeTile, e.clientX, e.clientY);
  });
  document.body.addEventListener('pointerup', ()=>{
    resetTilt(activeTile);
    activeTile = null;
  });
  document.body.addEventListener('pointercancel', ()=>{
    resetTilt(activeTile);
    activeTile = null;
  });
})();

function nextStory(){
  if(currentStoryIndex < STORY_ORDER.length - 1){
    currentStoryIndex++;
    renderStoryOverlay();
  } else {
    closeStory();
  }

function prevStory(){
  if(currentStoryIndex > 0){
    currentStoryIndex--;
    renderStoryOverlay();
  }
}
function closeStory(){
  const overlay = document.getElementById('storyOverlay');
  if(overlay) overlay.remove();
}
function openStory(id){
  const idx = STORY_ORDER.indexOf(id);
  currentStoryIndex = idx >= 0 ? idx : 0;

function wireStorySwipe(overlay){
  let startX = 0, startY = 0, startTime = 0;
  overlay.addEventListener('touchstart', (e)=>{
    if(e.touches.length !== 1) return;
    startX = e.touches[0].clientX;
    startY = e.touches[0].clientY;
    startTime = Date.now();
  }, { passive:true });
  overlay.addEventListener('touchend', (e)=>{
    const t = e.changedTouches[0];
    if(!t) return;
    const dx = t.clientX - startX, dy = t.clientY - startY;
    const dt = Date.now() - startTime;
    if(dt > 800) return; // too slow to count as a swipe
    if(Math.abs(dy) > Math.abs(dx) && Math.abs(dy) > 60){
      closeStory(); // swipe up or down
      return;
    }
    if(Math.abs(dx) > 60){
      if(dx < 0) nextStory(); else prevStory();
    }
  }, { passive:true });
}

function updateStreak(){
  try{
    const today = new Date().toISOString().slice(0,10);
    const yesterday = new Date(Date.now() - 86400000).toISOString().slice(0,10);
    let data = JSON.parse(localStorage.getItem('visitStreak') || 'null') || { lastVisit: null, count: 0 };
    let justIncremented = false;
    if(data.lastVisit !== today){
      data.count = (data.lastVisit === yesterday) ? data.count + 1 : 1;
      data.lastVisit = today;
      localStorage.setItem('visitStreak', JSON.stringify(data));
      justIncremented = true;
    }
    const longest = parseInt(localStorage.getItem('longestStreak') || '0', 10);
    if(data.count > longest){
      try{ localStorage.setItem('longestStreak', String(data.count)); }catch(e){}
    }
    return { count: data.count, justIncremented };
  }catch(e){ return { count: 1, justIncremented: false }; }
}
function renderStreakBadge(){
