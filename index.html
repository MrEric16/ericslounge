function wireExtrasCarousel(container){
  const wrap = container.querySelector('#extrasCarousel');
  const dotsWrap = container.querySelector('#extrasDots');
  if(!wrap || !dotsWrap) return;
  const slides = [...wrap.querySelectorAll('.carousel-slide')];
  const dots = [...dotsWrap.querySelectorAll('.carousel-dot')];
  let order = slides.map((_, i) => i); // order[0] is the slide index currently on top

  function render(){
    order.forEach((slideIdx, pos) => { slides[slideIdx].dataset.pos = pos; });
    dots.forEach((d, i) => d.classList.toggle('active', i === order[0]));
  }
  // Settle lock: the CSS transition on .carousel-slide runs .35s (see the stylesheet). If a
  // new swipe/tap starts before that finishes, the dataset.pos change fires mid-transition
  // and the browser is left animating toward a position that's already stale -- cards freeze
  // at partial opacity/offset, which is the overlapping-card glitch reported. Every gesture
  // now has to wait out a short settle window (slightly longer than the CSS transition)
  // before the next one is accepted, so swipes always resolve cleanly before the next begins.
  const SETTLE_MS = 360;
  let locked = false, lockTimer = null;
  function lockBriefly(){
    locked = true;
    clearTimeout(lockTimer);
    lockTimer = setTimeout(()=>{ locked = false; }, SETTLE_MS);
  }
  function advanceOne(){ if(locked) return; order.push(order.shift()); render(); lockBriefly(); }
  function retreatOne(){ if(locked) return; order.unshift(order.pop()); render(); lockBriefly(); }
  function advanceTo(targetIdx){
    if(locked) return;
    while(order[0] !== targetIdx){
      order.push(order.shift());
    }
    render();
    lockBriefly();
  }

  // Swiping the top card left advances (same direction as the existing tap-to-advance),
  // swiping right goes back -- previously there was no "back" at all, only cycling
  // forward or jumping via the dots. A swipe is only recognized once horizontal movement
  // clearly dominates vertical, so a vertical drag (e.g. scrolling a long riddle card's
  // own text, or just scrolling the page past the carousel) is left completely alone.
  let startX = 0, startY = 0, dragging = false, isHorizontalSwipe = false, swipeJustHandled = false;
  let swipeFlagTimer = null;
  function pointOf(e){ return e.changedTouches ? e.changedTouches[0] : e; }
  function onDown(e){
    if(locked) return; // previous gesture's transition is still settling -- ignore until it's done
    if(e.target.closest('.riddle-reveal-btn') || e.target.closest('a')) return;
    dragging = true; isHorizontalSwipe = false;
    const p = pointOf(e);
    startX = p.clientX; startY = p.clientY;
  }
  function onMove(e){
    if(!dragging) return;
    const p = pointOf(e);
    const dx = p.clientX - startX, dy = p.clientY - startY;
    if(!isHorizontalSwipe && Math.abs(dx) > 10 && Math.abs(dx) > Math.abs(dy)){
      isHorizontalSwipe = true;
    }
    if(isHorizontalSwipe){
      e.preventDefault(); // only once a horizontal card-swipe is confirmed, not a page/card scroll
      const topSlide = slides[order[0]];
      topSlide.style.transition = 'none';
      topSlide.style.transform = `translateX(${dx}px) rotate(${dx*0.03}deg)`;
      topSlide.style.opacity = String(Math.max(0.4, 1 - Math.abs(dx)/300));
    }
  }
  function onUp(e){
    if(!dragging) return;
    dragging = false;
    const p = pointOf(e);
    const dx = p.clientX - startX;
    const topSlide = slides[order[0]];
    topSlide.style.transition = '';
    topSlide.style.transform = '';
    topSlide.style.opacity = '';
    if(isHorizontalSwipe){
      swipeJustHandled = true;
      // Fallback clear in case the browser never fires the matching click (pointercancel,
      // finger lifted off the element, etc.) -- previously this flag was only ever cleared
      // by the NEXT pointerdown, which raced against a delayed click from THIS swipe and
      // could let that stale click fire an extra, unwanted advanceOne() mid-transition.
      clearTimeout(swipeFlagTimer);
      swipeFlagTimer = setTimeout(()=>{ swipeJustHandled = false; }, 400);
      if(Math.abs(dx) > 40){
        if(dx < 0) advanceOne(); else retreatOne();
      }
    }
    isHorizontalSwipe = false;
  }
  // A cancelled gesture (iOS intercepting the touch mid-swipe -- same OS-level gesture
  // interception documented for the swipe-back problem elsewhere in this app) previously
  // left the dragged card's inline transform/opacity permanently stuck: onUp was only ever
  // wired to pointerup/pointerleave, and pointercancel fires instead of pointerup when the
  // OS steals the gesture, so dragging never got reset. That's what left a card frozen
  // mid-drag -- offset, partially transparent, overlapping the next card -- which reads
  // exactly like the reported "stuck, overlapping cards" glitch and has nothing to do with
  // swipe speed. This resets the visual state without treating the interrupted gesture as
  // an intentional swipe (no advance/retreat call, unlike onUp).
  function onCancel(){
    if(!dragging) return;
    dragging = false;
    const topSlide = slides[order[0]];
    topSlide.style.transition = '';
    topSlide.style.transform = '';
    topSlide.style.opacity = '';
    isHorizontalSwipe = false;
  }
  wrap.addEventListener('pointercancel', onCancel);
  wrap.addEventListener('pointerdown', onDown);
  wrap.addEventListener('pointermove', onMove);
  wrap.addEventListener('pointerup', onUp);
  wrap.addEventListener('pointerleave', onUp);

  wrap.addEventListener('click', (e)=>{
    if(swipeJustHandled){ swipeJustHandled = false; clearTimeout(swipeFlagTimer); return; } // a swipe, not a tap -- don't also advance
    if(e.target.closest('a')) return; // let "read more" links work normally
    const revealBtn = e.target.closest('.riddle-reveal-btn');
    if(revealBtn){
      const answer = revealBtn.nextElementSibling;
      if(answer && answer.classList.contains('riddle-answer')){
        const showing = !answer.hasAttribute('hidden');
        if(showing){ answer.setAttribute('hidden',''); revealBtn.textContent = 'Tap to reveal answer'; }
        else{ answer.removeAttribute('hidden'); revealBtn.textContent = 'Hide answer'; }
      }
      return; // don't also advance the carousel
    }
    // Tap zones: right side of the card = next, left side = previous. Same directions as
    // the swipe gesture, just via a plain tap instead of a drag.
    const rect = wrap.getBoundingClientRect();
    const tapX = e.clientX - rect.left;
    if(tapX < rect.width / 2) retreatOne(); else advanceOne();
  });

  dots.forEach((d, i) => {
    d.addEventListener('click', (e)=>{
      e.stopPropagation();
      advanceTo(i);
    });
  });
}

function isDictLookupCandidate(q){
  const normalized = q.toLowerCase().replace(/\s+/g, ' ').trim();
  return /^[a-zA-Z]{2,}$/.test(q) || /^to\s+[a-zA-Z]{2,}$/.test(q) || PHRASAL_VERBS.hasOwnProperty(normalized);
}
// Students conventionally look up verbs by their infinitive form ("to read") rather than
// the bare verb ("read") -- a plain single-word check alone rejects "to read" outright as
// a two-word phrase, which is wrong for a vocabulary-teaching site where infinitive form
// is the standard way verbs get referenced. Strips a leading "to " so "to read" looks up
// "read" (the actual dictionary headword) instead of finding nothing.
function stripInfinitive(q){
  const m = q.match(/^to\s+([a-zA-Z]{2,})$/);
  return m ? m[1] : q;
}
async function fetchWordEntry(word){
  const cacheKey = 'dictword_' + word.toLowerCase();
  try{
    const cached = localStorage.getItem(cacheKey);
    if(cached) return JSON.parse(cached);
  }catch(e){}

  // Phrasal verbs resolve instantly from the local PHRASAL_VERBS set -- no network call,
  // since dictionaryapi.dev/Datamuse coverage of multi-word headwords is unreliable and
  // this closed set is curated specifically for this site's students.
  const pvKey = word.toLowerCase().replace(/\s+/g, ' ').trim();
  if(PHRASAL_VERBS.hasOwnProperty(pvKey)){
    const pv = PHRASAL_VERBS[pvKey];
    const entry = { word: pvKey, partOfSpeech: 'phrasal verb', definition: pv.def, example: pv.ex, synonyms: [], antonyms: [] };
    try{ localStorage.setItem(cacheKey, JSON.stringify(entry)); }catch(e){}
    return entry;
  }

  // Multi-source lookup, run in parallel: dictionaryapi.dev is tried first (it has real
  // example sentences, which Datamuse never provides), but if it comes back empty for
  // ANY reason -- word missing from its Wiktionary-derived data, a malformed response,
  // a transient failure -- Datamuse's own definitions (sp=<word>&md=d, sourced from
  // WordNet AND Wiktionary combined per Datamuse's own documentation) are used as a
  // genuinely independent second source instead of the card just showing nothing.
  // Reported directly: common, ordinary words (apprehensive, anxious, timid) were
  // returning no result at all -- this fallback exists specifically so a single source's
  // gap or hiccup doesn't mean "no definition," full stop.
  let defData = null, synData = null, antData = null, datamuseDefData = null;
  try{
    const [defRes, synRes, antRes, datamuseDefRes] = await Promise.allSettled([
      fetch(`https://api.dictionaryapi.dev/api/v2/entries/en/${encodeURIComponent(word)}`).then(r => r.ok ? r.json() : null),
      fetch(`https://api.datamuse.com/words?rel_syn=${encodeURIComponent(word)}&max=6`).then(r => r.ok ? r.json() : []),
      fetch(`https://api.datamuse.com/words?rel_ant=${encodeURIComponent(word)}&max=6`).then(r => r.ok ? r.json() : []),
      fetch(`https://api.datamuse.com/words?sp=${encodeURIComponent(word)}&md=d&max=1`).then(r => r.ok ? r.json() : []),
    ]);
    defData = defRes.status === 'fulfilled' ? defRes.value : null;
    synData = synRes.status === 'fulfilled' ? synRes.value : [];
    antData = antRes.status === 'fulfilled' ? antRes.value : [];
    datamuseDefData = datamuseDefRes.status === 'fulfilled' ? datamuseDefRes.value : [];
  }catch(e){ return null; }

  let entryWord, partOfSpeech = '', definition = '', example = null, found = false;

  // Primary source: dictionaryapi.dev
  if(defData && Array.isArray(defData) && defData.length > 0){
    const meanings = defData[0].meanings || [];
    if(meanings.length > 0){
      const firstMeaning = meanings[0];
      const firstDef = (firstMeaning.definitions || [])[0];
      if(firstDef){
        found = true;
        entryWord = defData[0].word || word;
        partOfSpeech = firstMeaning.partOfSpeech || '';
        definition = firstDef.definition || '';
        // The first definition often lacks its own example even when a later one in the
        // same entry has one -- search all definitions across all meanings for the first
        // example available, rather than showing nothing when one genuinely exists.
        example = firstDef.example || null;
        if(!example){
          outer: for(const m of meanings){
            for(const d of (m.definitions || [])){
              if(d.example){ example = d.example; break outer; }
            }
          }
        }
      }
    }
  }

  // Fallback source: Datamuse's own definitions. No example sentence available this way
  // (Datamuse doesn't provide one), but a real definition beats showing nothing.
  if(!found){
    const posMatch = (datamuseDefData || []).find(e => (e.word || '').toLowerCase() === word.toLowerCase());
    const defs = posMatch && posMatch.defs;
    if(defs && defs.length > 0){
      const [posAbbr, defText] = defs[0].split('\t');
      const POS_MAP = { n:'noun', v:'verb', adj:'adjective', adv:'adverb', u:'' };
      found = true;
      entryWord = posMatch.word;
      partOfSpeech = POS_MAP[posAbbr] !== undefined ? POS_MAP[posAbbr] : (posAbbr || '');
      definition = defText || defs[0];
      example = null;
    }
  }

  if(!found) return null; // genuinely not found in either source

  const entry = {
    word: entryWord,
    partOfSpeech,
    definition,
    example,
    synonyms: (synData || []).map(x => x.word).slice(0, 6),
    antonyms: (antData || []).map(x => x.word).slice(0, 6),
  };
  try{ localStorage.setItem(cacheKey, JSON.stringify(entry)); }catch(e){}
  return entry;
}
function dictCardHtml(entry){
  const key = 'word:' + entry.word.toLowerCase();
  const saved = isBookmarked(key);
  return `
    <div class="dict-card">
      <div class="dict-card-head">
        <div>
          <span class="dict-word">${escapeHtml(entry.word)}</span>
          ${entry.partOfSpeech ? `<span class="dict-pos">${escapeHtml(entry.partOfSpeech)}</span>` : ''}
        </div>
        <button class="bookmark-btn dict-save-btn ${saved ? 'active' : ''}" title="Save word">${saved ? icon('bookmarkFilled') : icon('bookmark')}</button>
      </div>
      <div class="dict-section">
        <div class="dict-label">Definition</div>
        <div class="dict-text">${escapeHtml(entry.definition)}</div>
      </div>
      ${entry.example ? `
      <div class="dict-section">
        <div class="dict-label">Example</div>
        <div class="dict-text dict-example">"${escapeHtml(entry.example)}"</div>
      </div>` : ''}
      ${entry.synonyms.length ? `
      <div class="dict-section">
        <div class="dict-label">Synonyms</div>
        <div class="dict-text">${entry.synonyms.map(escapeHtml).join(', ')}</div>
      </div>` : ''}
      ${entry.antonyms.length ? `
      <div class="dict-section">
        <div class="dict-label">Antonyms</div>
        <div class="dict-text">${entry.antonyms.map(escapeHtml).join(', ')}</div>
      </div>` : ''}
    </div>
  `;
}
function wireDictCard(container, entry){
  const btn = container.querySelector('.dict-save-btn');
  if(!btn) return;
  btn.addEventListener('click', ()=>{
    const item = { key: 'word:' + entry.word.toLowerCase(), type:'word', word: entry.word, partOfSpeech: entry.partOfSpeech, definition: entry.definition, example: entry.example, synonyms: entry.synonyms, antonyms: entry.antonyms };
    const nowSaved = toggleBookmark(item);
    btn.classList.toggle('active', nowSaved);
    btn.innerHTML = nowSaved ? icon('bookmarkFilled') : icon('bookmark');
  });
}

function wireSearch(container){
  const input = container.querySelector('#searchInput');
  const results = container.querySelector('#searchResults');
  const dictCard = container.querySelector('#dictCard');
  if(!input || !results) return;

  // Faculties are searchable by name too, jumping straight to that domain's page.
  const facultyPages = FACULTIES.map(f => ({
    name: f.label, desc: `Browse everything filed under ${f.label}.`, url: `#faculty/${f.key}`, icon: f.icon
  }));
  const allPages = [...SEARCHABLE_PAGES, ...facultyPages];

  // Dictionary lookup runs on a debounce, completely separate from the instant local-array
  // filtering below -- typing normally shouldn't fire a network request per keystroke, and
  // a network lookup completing slightly after the local results render is fine since it's
  // a distinct card, not something the local results need to wait on.
  let dictDebounceTimer = null;
  let dictRequestId = 0;
  function handleDictLookup(q){
    clearTimeout(dictDebounceTimer);
    if(!dictCard) return;
    if(!isDictLookupCandidate(q)){
      dictCard.innerHTML = '';
      return;
    }
    const lookupWord = stripInfinitive(q);
    const thisRequestId = ++dictRequestId;
    dictDebounceTimer = setTimeout(async ()=>{
      const entry = await fetchWordEntry(lookupWord);
      if(thisRequestId !== dictRequestId) return; // a newer keystroke has since superseded this lookup
      if(!entry){ dictCard.innerHTML = ''; return; }
      dictCard.innerHTML = dictCardHtml(entry);
      wireDictCard(dictCard, entry);
    }, 450);
  }

  input.addEventListener('input', ()=>{
    const q = input.value.trim().toLowerCase();
    handleDictLookup(q);
    if(q.length === 0){
      results.innerHTML = '';
      return;
    }
    // Easter egg: typing "pixel8" surfaces the 4 in-house games directly, standalone
    // (via #arcade/<id>, not gated behind Mind Temple's emotion picker). Deliberately
    // undocumented anywhere in the UI -- students find it or they don't. Short-circuits
    // every other search branch below, same pattern as any other exact-match special case
    // would, so it never gets diluted by unrelated partial-text matches.
    if(q === 'pixel8'){
      const gameResults = Object.keys(MT_EMBEDDED_GAMES).map(id => ({
        name: MT_EMBEDDED_GAMES[id].title,
        desc: 'Tap to play.',
        url: `#arcade/${id}`,
        icon: 'dice',
      }));
      results.innerHTML = pageResultsHtml(gameResults);
      return;
    }
    const articleMatches = DISPATCHES.filter(a => a.headline.toLowerCase().includes(q));
    const videoMatches = WATCH_VIDEOS.filter(v => v.title.toLowerCase().includes(q) || v.channel.toLowerCase().includes(q));
    const exploreMatches = EXPLORE_SITES.filter(s => s.name.toLowerCase().includes(q) || s.desc.toLowerCase().includes(q));
    const pageMatches = allPages.filter(p => p.name.toLowerCase().includes(q) || p.desc.toLowerCase().includes(q) || (p.keywords||[]).some(k => k.includes(q)));
    const birthdayMatches = BIRTHDAYS.filter(b => b.name.toLowerCase().includes(q));
    // Matches on title OR category (e.g. typing "theatre" finds every theatre
    // event, even ones whose title doesn't literally contain that word).
    const tashkentEventMatches = EVENTS_TASHKENT.filter(e =>
      (e.title||'').toLowerCase().includes(q) || (e.category||'').toLowerCase().includes(q)
    );
    const virtualEventMatches = [...VIRTUAL_EVENTS.dated, ...VIRTUAL_EVENTS.perpetual].filter(e =>
      (e.title||'').toLowerCase().includes(q) || (e.category||'').toLowerCase().includes(q)
    );

    if(articleMatches.length === 0 && videoMatches.length === 0 && exploreMatches.length === 0 && pageMatches.length === 0 && birthdayMatches.length === 0 && tashkentEventMatches.length === 0 && virtualEventMatches.length === 0){
      results.innerHTML = `<div class="empty-card">Nothing found for "${escapeHtml(input.value.trim())}". Try something else.</div>`;
      return;
    }

    let html = '';
    if(birthdayMatches.length > 0){
      html += `<div class="section-head" style="margin-top:0;"><span class="emoji">${icon('cake')}</span><h2>Names</h2></div>`;
      html += birthdayResultsHtml(birthdayMatches);
    }
    if(pageMatches.length > 0){
      html += `<div class="section-head" style="margin-top:${html?'24px':'0'};"><span class="emoji">${icon('compass2')}</span><h2>Pages</h2></div>`;
      html += pageResultsHtml(pageMatches);
    }
    if(tashkentEventMatches.length > 0){
      html += `<div class="section-head" style="margin-top:${html?'24px':'0'};"><span class="emoji">${icon('calendar')}</span><h2>Events in Tashkent</h2></div>`;
      html += tashkentEventMatches.map(e => `
        <a class="page-result" href="${e.url || '#events-tashkent'}" target="${e.url ? '_blank' : '_self'}" rel="noopener">
          <span class="page-result-icon">${icon('calendar')}</span>
          <div>
            <div class="page-result-name">${escapeHtml(e.title)}</div>
            <div class="page-result-desc">${escapeHtml(e.category || '')}${e.startDate ? ' · ' + formatShortDate(e.startDate) : ''}</div>
          </div>
        </a>
      `).join('');
    }
    if(virtualEventMatches.length > 0){
      html += `<div class="section-head" style="margin-top:${html?'24px':'0'};"><span class="emoji">${icon('globe')}</span><h2>Online Events</h2></div>`;
      html += virtualEventMatches.map(e => `
        <a class="page-result" href="${e.url || '#events-virtual'}" target="${e.url ? '_blank' : '_self'}" rel="noopener">
          <span class="page-result-icon">${icon('globe')}</span>
          <div>
            <div class="page-result-name">${escapeHtml(e.title)}</div>
            <div class="page-result-desc">${escapeHtml(e.category || e.org || '')}${e.startDate ? ' · ' + formatShortDate(e.startDate) : ' · ongoing'}</div>
          </div>
        </a>
      `).join('');
    }
    if(exploreMatches.length > 0){
      html += `<div class="section-head" style="margin-top:${html?'24px':'0'};"><span class="emoji">${icon('compass2')}</span><h2>Websites</h2></div>`;
      html += exploreResultsHtml(exploreMatches);
    }
    if(articleMatches.length > 0){
      html += `<div class="section-head" style="margin-top:${html?'24px':'0'};"><span class="emoji">${icon('newspaper')}</span><h2>Articles</h2></div>`;
      html += dispatchListHtml(articleMatches);
    }
    if(videoMatches.length > 0){
      html += `<div class="section-head" style="margin-top:${html?'24px':'0'};"><span class="emoji">${icon('clapper')}</span><h2>Videos</h2></div>`;
      html += `<div class="watch-grid">${watchGridHtml(videoMatches, 'search')}</div>`;
    }
    results.innerHTML = html;
    wireEntryActions(results);
    wireWatchButtons(results);
  });
}

async function loadStats(){
  const body = document.getElementById('statsBody');
  if(!body) return;
  if(!supabaseClient){ body.textContent = 'Analytics not configured.'; return; }
  const { data, error } = await supabaseClient.from('analytics_events').select('*').order('created_at', { ascending:true });
  if(error || !data){ body.textContent = 'Could not load stats.'; return; }

  const opens = data.filter(d=>d.event_type==='open');
  const views = data.filter(d=>d.event_type==='view');
  const sessions = data.filter(d=>d.event_type==='session_end');
  const articleClicks = data.filter(d=>d.event_type==='click_article');
  const videoClicks = data.filter(d=>d.event_type==='click_video');
  const instrumentClicks = data.filter(d=>d.event_type==='click_instrument');

  const dayCounts = {};
  opens.forEach(o=>{ const d = o.created_at.slice(0,10); dayCounts[d]=(dayCounts[d]||0)+1; });
  const days = Object.keys(dayCounts).sort().slice(-14);

  const hourCounts = new Array(24).fill(0);
  opens.forEach(o=>{ const h = new Date(o.created_at).getHours(); hourCounts[h]++; });

  // Most-clicked domain: pull the faculty key out of view labels like "faculty/science"
  const domainCounts = {};
  views.forEach(v=>{
    const m = (v.label||'').match(/^faculty\/([a-z-]+)$/);
    if(m && m[1] !== 'all'){ domainCounts[m[1]] = (domainCounts[m[1]]||0) + 1; }
  });
  const topDomains = Object.entries(domainCounts).sort((a,b)=>b[1]-a[1]).slice(0,10);

  function topN(list, n){
    const counts = {};
    list.forEach(x=>{ const l = x.label || '(untitled)'; counts[l]=(counts[l]||0)+1; });
    return Object.entries(counts).sort((a,b)=>b[1]-a[1]).slice(0,n);
  }
  const topArticles = topN(articleClicks, 10);
  const topVideos = topN(videoClicks, 10);
  const topInstruments = topN(instrumentClicks, 10);

  const durations = sessions.map(x=>parseInt(x.label||'0',10));
  const totalSeconds = durations.reduce((s,x)=>s+x,0);
  const avgDuration = sessions.length ? Math.round(totalSeconds/sessions.length) : 0;
  const totalMinutes = Math.round(totalSeconds/60);

  const uniqueUsers = new Set(data.map(d=>d.user_id).filter(Boolean));
  const userDays = {};
  data.forEach(d=>{ if(!d.user_id) return; const day = d.created_at.slice(0,10); (userDays[d.user_id] = userDays[d.user_id] || new Set()).add(day); });
  const returningUsers = Object.values(userDays).filter(s=>s.size>1).length;

  function barChart(id, labels, values, color, title){
    return `<div class="entry" style="padding:16px; margin-bottom:14px;"><canvas id="${id}" height="${Math.max(140, labels.length*26)}"></canvas></div>`;
  }

  body.outerHTML = `
    <div style="margin-bottom:16px;">
      <div class="empty-card">
        Total opens: <b>${opens.length}</b> · Unique users: <b>${uniqueUsers.size}</b> · Returning users: <b>${returningUsers}</b><br>
        Total time on site: <b>${totalMinutes} min</b> · Avg session: <b>${avgDuration}s</b> · Total page views: <b>${views.length}</b>
      </div>
    </div>
    <div class="entry" style="padding:16px; margin-bottom:14px;"><canvas id="chartDays" height="180"></canvas></div>
    <div class="entry" style="padding:16px; margin-bottom:14px;"><canvas id="chartHours" height="180"></canvas></div>
    ${barChart('chartDomains', topDomains.map(v=>v[0]), topDomains.map(v=>v[1]))}
    ${barChart('chartArticles', topArticles.map(v=>v[0]), topArticles.map(v=>v[1]))}
    ${barChart('chartVideos', topVideos.map(v=>v[0]), topVideos.map(v=>v[1]))}
    ${barChart('chartInstruments', topInstruments.map(v=>v[0]), topInstruments.map(v=>v[1]))}
  `;

  new Chart(document.getElementById('chartDays'), {
    type:'line',
    data:{ labels: days, datasets:[{ label:'Opens per day', data: days.map(d=>dayCounts[d]||0), borderColor:'#7A2E35', backgroundColor:'rgba(122,46,53,.15)', fill:true, tension:.3 }] },
    options:{ plugins:{ title:{ display:true, text:'Opens per day' } } }
  });
  new Chart(document.getElementById('chartHours'), {
    type:'bar',
    data:{ labels: [...Array(24).keys()].map(h=>h+':00'), datasets:[{ label:'Opens by hour (peak times)', data: hourCounts, backgroundColor:'#D4AF37' }] },
    options:{ plugins:{ title:{ display:true, text:'Peak usage hours' } } }
  });
  new Chart(document.getElementById('chartDomains'), {
    type:'bar', indexAxis:'y',
    data:{ labels: topDomains.map(v=>v[0]), datasets:[{ label:'Views', data: topDomains.map(v=>v[1]), backgroundColor:'#6B7A3D' }] },
    options:{ plugins:{ title:{ display:true, text:'Most-clicked domain' } } }
  });
  new Chart(document.getElementById('chartArticles'), {
    type:'bar', indexAxis:'y',
    data:{ labels: topArticles.map(v=>v[0]), datasets:[{ label:'Clicks', data: topArticles.map(v=>v[1]), backgroundColor:'#7A2E35' }] },
    options:{ plugins:{ title:{ display:true, text:'Most-clicked articles' } } }
  });
  new Chart(document.getElementById('chartVideos'), {
    type:'bar', indexAxis:'y',
    data:{ labels: topVideos.map(v=>v[0]), datasets:[{ label:'Clicks', data: topVideos.map(v=>v[1]), backgroundColor:'#A8A090' }] },
    options:{ plugins:{ title:{ display:true, text:'Most-clicked videos' } } }
  });
  new Chart(document.getElementById('chartInstruments'), {
    type:'bar', indexAxis:'y',
    data:{ labels: topInstruments.map(v=>v[0]), datasets:[{ label:'Clicks', data: topInstruments.map(v=>v[1]), backgroundColor:'#D4AF37' }] },
    options:{ plugins:{ title:{ display:true, text:'Most-clicked instruments' } } }
  });
}

function wireInstallPage(){
  if(isStandaloneApp() || isIOSDevice()) return;
  const btn = document.getElementById('installNowBtn');
  const statusText = document.getElementById('installStatusText');
  const tryPrompt = () => {
    if(deferredInstallPrompt){
      deferredInstallPrompt.prompt();
      deferredInstallPrompt.userChoice.then(choice => {
        if(statusText) statusText.textContent = choice.outcome === 'accepted' ? "Installed — check your Home Screen." : "No worries — tap Install now whenever you're ready.";
        deferredInstallPrompt = null;
      });
    } else if(statusText){
      statusText.textContent = "One-tap install isn't available on this browser — use the browser menu (⋮) and look for \"Install app\" or \"Add to Home Screen\" instead.";
    }
  };
  // Auto-attempt right away — the closest the web platform allows to "automatic".
  setTimeout(tryPrompt, 400);
  if(btn) btn.addEventListener('click', tryPrompt);
}

/* ================================================================
   MIND TEMPLE
   A situation -> thought -> feeling -> action reflection exercise.
   Deliberate design constraints, per direct instruction, non-negotiable:
     - ZERO persistence. No localStorage, no sessionStorage, no cookies, nothing
       written to disk anywhere in this module. State lives only in the mtState
       object below, which is thrown away and rebuilt fresh every time this page
       loads (see mtInit()). Closing the tab leaves no trace anything happened.
     - ZERO reporting anywhere. Nothing here is ever sent to a server, to Mr Eric,
       or anywhere else. The only thing this module ever does with what a student
       writes is decide, locally, in the browser, which closing message to show.
     - ZERO redirection. No phone numbers, no external links, no names of specific
       institutions. Everything stays inside the app.
     - Never forced. Every step has a way back (edit a previous answer) and a way
       out (exit without finishing) that doesn't nag or guilt-trip.
     - No feedback on what's written. This is a space to think, not a graded
       exercise -- nothing here evaluates, corrects, or responds to the content
       of an answer, except the one narrow acute-risk check below.
   ================================================================ */

// with no emotional charge in either direction that always closes with "talk to Mr Eric"
// makes no sense for someone who picked "Happy" or "Peaceful" -- that bug shipped in the
// first version and got caught immediately. See mtStepHtml()'s 'declined' and 'closing'
// branches, which now read this field to pick an appropriate message instead of one
// message for every emotion regardless of whether it was a good one.
// Each category carries a valence -- this matters for more than just color. A category
// with no emotional charge in either direction that always closes with "talk to Mr Eric"
// makes no sense for someone who picked "Joyful" or "Trusting" -- that bug shipped in the

/* ---- Embedded mess-about games ----
   All in-house now -- the external site pool has been fully retired (see the retired list
   just above). Every game here runs entirely inline: no new tab, no external site, no
   image/audio files, no network call anywhere. Each exposes mount(container) -> cleanup().
   mtRender() calls the previously-active game's cleanup before ever wiping the container's
   innerHTML, and mtExit()/renderRoute() do the same on the way out -- a detached canvas's
   requestAnimationFrame loop does NOT stop on its own just because the DOM node was
   removed, so this is not optional.
   Checkers: full Russian draughts rules -- men capture in all 4 diagonal directions
   (forward AND backward), kings fly any distance along a clear diagonal and can capture
   from a distance, landing on any empty square beyond the captured piece. Simplification:
   no "must capture the maximum number of pieces" majority-capture rule -- any legal
   capture chain is allowed, not just the longest available one.
   Chess: full standard rules -- check, checkmate, stalemate, castling (both sides, with
   proper attacked-square checks), en passant, pawn double-step. Simplification: no draw by
   repetition or 50-move rule, and pawns always auto-promote to a queen (no under-promotion
   picker in the UI). AI is deliberately simple (same spirit as checkers): takes an
   immediate checkmate if one exists, otherwise picks the move with the best material
   result after a 1-ply "what could they capture back" safety check, not a deep search. */

// ============ Pop Session ============
function mtMountPopGame(container){
  container.innerHTML = '<canvas class="mt-embedded-canvas"></canvas><div class="mt-embedded-hint">Tap the bubbles.</div>';
  const canvas = container.querySelector('canvas');
  const ctx = canvas.getContext('2d');
  let running = true;
  let bubbles = [];
  let particles = [];
  let shake = 0;
  const dpr = Math.max(1, window.devicePixelRatio || 1);
  const H = 260;

  function resize(){
    const w = container.clientWidth;
    canvas.style.width = w + 'px';
    canvas.style.height = H + 'px';
    canvas.width = Math.floor(w * dpr);
    canvas.height = Math.floor(H * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }
  resize();
  window.addEventListener('resize', resize);

  const COLORS = ['#5A8F4E','#2E7B8A','#B89434','#B6B235','#4A5578'];
  const CONFETTI_COLORS = ['#FFD700','#FF6B6B','#4ECDC4','#B6B235','#A6342E','#2E7B8A','#F5F1E6'];
  const GOLD = '#FFD24D';
  // MIN_BUBBLES is enforced every single frame, not left to chance -- popping fast enough
  // to empty the screen used to leave a gap before the next one spawned. Now the count is
  // topped straight back up to the minimum the instant it dips below, so there is always
  // something on screen to tap; MAX_BUBBLES is just a density ceiling above that floor.
  const MIN_BUBBLES = 10;
  const MAX_BUBBLES = 20;
  let goldenOnScreen = false;
  function spawnBubble(){
    const w = container.clientWidth;
    const r = 16 + Math.random()*20;
    // At most one golden bubble on screen at a time -- special enough to notice, not so
    // frequent it stops feeling special. Small independent chance each spawn.
    const isGolden = !goldenOnScreen && Math.random() < 0.08;
    if(isGolden) goldenOnScreen = true;
    bubbles.push({
      x: r + Math.random() * Math.max(1, w - r*2),
      y: r + Math.random() * Math.max(1, H - r*2),
      r, color: COLORS[Math.floor(Math.random()*COLORS.length)],
      pop: 0, alive: true, golden: isGolden, pulse: Math.random()*Math.PI*2,
    });
  }
  for(let i=0;i<12;i++) spawnBubble();

  function burst(x, y, color, count, speedMin, speedMax, sizeMin, sizeMax){
    for(let i=0;i<count;i++){
      const ang = Math.random()*Math.PI*2;
      const speed = speedMin + Math.random()*(speedMax-speedMin);
      particles.push({
        x, y, vx:Math.cos(ang)*speed, vy:Math.sin(ang)*speed - 1.5,
        size: sizeMin + Math.random()*(sizeMax-sizeMin),
        color, life:1,
      });
    }
  }

  let rafId = null;
  function draw(){
    if(!running) return;
    const w = container.clientWidth;
    ctx.save();
    if(shake > 0.3){
      ctx.translate((Math.random()-0.5)*shake, (Math.random()-0.5)*shake);
      shake *= 0.82;
    } else { shake = 0; }
    ctx.clearRect(-20,-20,w+40,H+40);
    for(const b of bubbles){
      if(!b.alive) continue;
      if(b.pop > 0){
        b.pop += 0.09;
        const scale = 1 + b.pop*0.6;
        ctx.globalAlpha = Math.max(0, 1 - b.pop);
        ctx.beginPath(); ctx.arc(b.x, b.y, b.r*scale, 0, Math.PI*2);
        ctx.fillStyle = b.golden ? GOLD : b.color; ctx.fill();
        ctx.globalAlpha = 1;
        if(b.pop >= 1) b.alive = false;
      } else if(b.golden){
        b.pulse += 0.12;
        const glow = 0.55 + Math.sin(b.pulse)*0.25;
        ctx.save();
        ctx.shadowColor = GOLD;
        ctx.shadowBlur = 14 + Math.sin(b.pulse)*6;
        ctx.beginPath(); ctx.arc(b.x, b.y, b.r, 0, Math.PI*2);
        ctx.fillStyle = GOLD; ctx.globalAlpha = glow + 0.35; ctx.fill();
        ctx.restore();
        ctx.beginPath(); ctx.arc(b.x - b.r*0.3, b.y - b.r*0.3, b.r*0.25, 0, Math.PI*2);
        ctx.fillStyle = 'rgba(255,255,255,0.7)'; ctx.fill();
      } else {
        ctx.beginPath(); ctx.arc(b.x, b.y, b.r, 0, Math.PI*2);
        ctx.fillStyle = b.color; ctx.fill();
        ctx.beginPath(); ctx.arc(b.x - b.r*0.3, b.y - b.r*0.3, b.r*0.25, 0, Math.PI*2);
        ctx.fillStyle = 'rgba(255,255,255,0.5)'; ctx.fill();
      }
    }
    bubbles = bubbles.filter(b => b.alive);
    // Immediate top-up to the floor (not probabilistic) whenever under it, PLUS the
    // original gentle probabilistic trickle up to the higher density ceiling.
    while(bubbles.length < MIN_BUBBLES) spawnBubble();
    while(bubbles.length < MAX_BUBBLES && Math.random() < 0.06) spawnBubble();

    for(const p of particles){
      p.vy += 0.14; p.x += p.vx; p.y += p.vy; p.life -= 0.02;
      if(p.life <= 0) continue;
      ctx.globalAlpha = Math.max(0, p.life);
      ctx.fillStyle = p.color; ctx.fillRect(p.x - p.size/2, p.y - p.size/2, p.size, p.size);
      ctx.globalAlpha = 1;
    }
    particles = particles.filter(p => p.life > 0);
    ctx.restore();
    rafId = requestAnimationFrame(draw);
  }
  rafId = requestAnimationFrame(draw);

  function handlePointer(e){
    const rect = canvas.getBoundingClientRect();
    const pts = e.changedTouches ? Array.from(e.changedTouches) : [e];
    for(const p of pts){
      const x = p.clientX - rect.left, y = p.clientY - rect.top;
      for(const b of bubbles){
        if(b.pop === 0 && b.alive){
          const dx = x - b.x, dy = y - b.y;
          if(dx*dx + dy*dy <= b.r*b.r){
            b.pop = 0.001;
            if(b.golden){
              // The golden pop: screen shake plus a big bright confetti burst, contained
              // entirely within this game's own canvas -- nothing escapes the window.
              goldenOnScreen = false;
              shake = 12;
              for(let i=0;i<36;i++){
                const color = CONFETTI_COLORS[Math.floor(Math.random()*CONFETTI_COLORS.length)];
                burst(b.x, b.y, color, 1, 2.5, 7, 4, 8);
              }
            } else {
              // Every ordinary pop now gets a small burst too, not just a fade -- a bit of
              // "explodey" satisfaction is the whole point of the game.
              burst(b.x, b.y, b.color, 8, 1.5, 4, 2, 4);
            }
          }
        }
      }
    }
  }
  canvas.addEventListener('pointerdown', handlePointer);

  return function cleanup(){
    running = false;
    if(rafId) cancelAnimationFrame(rafId);
    window.removeEventListener('resize', resize);
    canvas.removeEventListener('pointerdown', handlePointer);
  };
}

function mtMountBlastGame(container){
  container.innerHTML = '<canvas class="mt-embedded-canvas"></canvas><div class="mt-embedded-controls"><button class="mt-embedded-btn" data-blast-reset>Rebuild now</button></div>';
  const canvas = container.querySelector('canvas');
  const ctx = canvas.getContext('2d');
  const resetBtn = container.querySelector('[data-blast-reset]');
  let running = true;
  const dpr = Math.max(1, window.devicePixelRatio || 1);
  const H = 320; // taller than before -- the whole canvas is now the play field, not just its lower half

  function resize(){
    const w = container.clientWidth;
    canvas.style.width = w + 'px';
    canvas.style.height = H + 'px';
    canvas.width = Math.floor(w * dpr);
    canvas.height = Math.floor(H * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }
  resize();
  window.addEventListener('resize', resize);

  const COLORS = ['#B6B235','#B5562E','#5A8F4E','#4A5578','#2E7B8A','#B89434'];
  let blocks = [], particles = [], falling = [], shake = 0, flash = 0;
  let rebuildTimer = null;

  // Blocks now tile the ENTIRE canvas edge to edge, both directions -- not a stack sitting
  // in the bottom half. Grid size is computed from the actual container size so it's dense
  // ("more tiles, more extravagant") on any real phone width.
  function buildBlocks(){
    const w = container.clientWidth;
    const targetSize = 34;
    const cols = Math.max(6, Math.floor(w / targetSize));
    const rows = Math.max(6, Math.floor(H / targetSize));
    const bw = w / cols, bh = H / rows;
    blocks = [];
    for(let r=0;r<rows;r++){
      for(let c=0;c<cols;c++){
        blocks.push({
          row:r, col:c, x:c*bw, y:r*bh, w:bw-2, h:bh-2,
          color: COLORS[(r+c) % COLORS.length], alive:true,
        });
      }
    }
    particles = []; falling = []; shake = 0; flash = 0;
    if(rebuildTimer){ clearTimeout(rebuildTimer); rebuildTimer = null; }
  }
  buildBlocks();

  function anyBlocksLeft(){ return blocks.some(b => b.alive); }
  function scheduleAutoRebuildIfCleared(){
    if(!anyBlocksLeft() && !rebuildTimer){
      rebuildTimer = setTimeout(() => { rebuildTimer = null; buildBlocks(); }, 3000);
    }
  }

  function detonate(block){
    if(!block.alive) return;
    block.alive = false;
    const cx = block.x + block.w/2, cy = block.y + block.h/2;
    // Bigger, more extravagant burst than before: more particles, wider speed range, plus
    // a bright flash and a brief screen-shake for real "explosion" feel.
    for(let i=0;i<22;i++){
      const ang = Math.random()*Math.PI*2, speed = 2.5 + Math.random()*7;
      particles.push({ x:cx, y:cy, vx:Math.cos(ang)*speed, vy:Math.sin(ang)*speed-3,
        size:3+Math.random()*7, color:block.color, life:1 });
    }
    flash = Math.min(1, flash + 0.55);
    shake = Math.min(14, shake + 8);
    // Knockback radius widened (roughly a 5x5 diamond instead of the old 3x3) so one tap
    // sets off a much bigger chunk of the grid -- more chain-reaction, more spectacle.
    for(const other of blocks){
      if(!other.alive || other === block) continue;
      const dr = other.row - block.row, dc = other.col - block.col;
      const dist = Math.sqrt(dr*dr + dc*dc);
      if(dist <= 2.2){
        other.alive = false;
        const ang = Math.atan2(dr, dc) + (Math.random()-0.5)*0.6;
        const force = (3 - dist) * 1.6 + Math.random()*1.5;
        falling.push({ x:other.x, y:other.y, w:other.w, h:other.h, color:other.color,
          vx: Math.cos(ang)*force, vy: Math.sin(ang)*force - 2 - Math.random()*2,
          rot:0, vrot:(Math.random()-0.5)*0.35 });
      }
    }
    scheduleAutoRebuildIfCleared();
  }

  let rafId = null;
  function draw(){
    if(!running) return;
    const w = container.clientWidth;
    ctx.save();
    if(shake > 0.3){
      ctx.translate((Math.random()-0.5)*shake, (Math.random()-0.5)*shake);
      shake *= 0.85;
    } else { shake = 0; }
    ctx.clearRect(-20,-20,w+40,H+40);
    for(const b of blocks){
      if(!b.alive) continue;
      ctx.fillStyle = b.color; ctx.fillRect(b.x, b.y, b.w, b.h);
    }
    for(const f of falling){
      f.vy += 0.25; f.x += f.vx; f.y += f.vy; f.rot += f.vrot;
      ctx.save(); ctx.translate(f.x + f.w/2, f.y + f.h/2); ctx.rotate(f.rot);
      ctx.fillStyle = f.color; ctx.fillRect(-f.w/2, -f.h/2, f.w, f.h); ctx.restore();
    }
    falling = falling.filter(f => f.y < H + 80);
    for(const p of particles){
      p.vy += 0.18; p.x += p.vx; p.y += p.vy; p.life -= 0.018;
      if(p.life <= 0) continue;
      ctx.globalAlpha = Math.max(0, p.life);
      ctx.fillStyle = p.color; ctx.fillRect(p.x, p.y, p.size, p.size);
      ctx.globalAlpha = 1;
    }
    particles = particles.filter(p => p.life > 0);
    if(flash > 0.01){
      ctx.globalAlpha = flash;
      ctx.fillStyle = '#FFF6D6';
      ctx.fillRect(0, 0, w, H);
      ctx.globalAlpha = 1;
      flash *= 0.8;
    }
    ctx.restore();
    rafId = requestAnimationFrame(draw);
  }
  rafId = requestAnimationFrame(draw);

  function handlePointer(e){
    const rect = canvas.getBoundingClientRect();
    const pts = e.changedTouches ? Array.from(e.changedTouches) : [e];
    for(const p of pts){
      const x = p.clientX - rect.left, y = p.clientY - rect.top;
      for(const b of blocks){
        if(!b.alive) continue;
        if(x >= b.x && x <= b.x+b.w && y >= b.y && y <= b.y+b.h) detonate(b);
      }
    }
  }
  canvas.addEventListener('pointerdown', handlePointer);
  function onReset(){ buildBlocks(); }
  resetBtn.addEventListener('click', onReset);

  return function cleanup(){
    running = false;
    if(rafId) cancelAnimationFrame(rafId);
    if(rebuildTimer) clearTimeout(rebuildTimer);
    window.removeEventListener('resize', resize);
    canvas.removeEventListener('pointerdown', handlePointer);
    resetBtn.removeEventListener('click', onReset);
  };
}

// ============ Checkers v2: flying kings + backward captures (Russian draughts style) ============
const MT_CK_SIZE = 8;
const MT_CK_KING_DIRS = [[-1,-1],[-1,1],[1,-1],[1,1]];
function mtCkCloneBoard(b){ return b.map(row => row.map(cell => cell ? {color:cell.color, king:cell.king} : null)); }
function mtCkInBounds(r,c){ return r>=0 && r<MT_CK_SIZE && c>=0 && c<MT_CK_SIZE; }
function mtCkInitBoard(){
  const board = Array.from({length:MT_CK_SIZE}, () => Array(MT_CK_SIZE).fill(null));
  for(let r=0;r<MT_CK_SIZE;r++){
    for(let c=0;c<MT_CK_SIZE;c++){
      if((r+c)%2===1){
        if(r<3) board[r][c] = {color:'black', king:false};
        else if(r>4) board[r][c] = {color:'red', king:false};
      }
    }
  }
  return board;
}
function mtCkManDirs(piece){
  // Men only ever WALK forward -- toward row 0 for red, toward row 7 for black. Capturing
  // is handled entirely separately in mtCkGetCaptures, which checks all 4 diagonals: in
  // Russian draughts a man captures backward just as freely as forward, it just can't
  // walk backward on a non-capturing move.
  return piece.color === 'red' ? [[-1,-1],[-1,1]] : [[1,-1],[1,1]];
}
function mtCkGetSimpleMoves(b, r, c){
  const piece = b[r][c];
  if(!piece) return [];
  const out = [];
  if(piece.king){
    // Flying king: slides any distance along a clear diagonal, landing on any empty
    // square along the way -- not just one step.
    for(const [dr,dc] of MT_CK_KING_DIRS){
      let rr = r+dr, cc = c+dc;
      while(mtCkInBounds(rr,cc) && b[rr][cc]===null){
        out.push({toR:rr, toC:cc});
        rr += dr; cc += dc;
      }
    }
  } else {
    for(const [dr,dc] of mtCkManDirs(piece)){
      const toR = r+dr, toC = c+dc;
      if(mtCkInBounds(toR,toC) && b[toR][toC]===null) out.push({toR,toC});
    }
  }
  return out;
}
function mtCkGetCaptures(b, r, c){
  const piece = b[r][c];
  if(!piece) return [];
  const out = [];
  if(piece.king){
    // Flying capture: walk outward over empty squares; the first occupied square must be
    // an opponent piece (an own piece blocks that direction entirely, no capture). Every
    // empty square immediately beyond that opponent piece, up until the next piece of
    // either color or the board edge, is a valid landing square -- a king can land several
    // different distances past the piece it's capturing, and the player picks which.
    // A king can never jump two pieces in a single hop, in either direction, by construction:
    // the landing search stops the instant it hits ANY second piece.
    for(const [dr,dc] of MT_CK_KING_DIRS){
      let rr = r+dr, cc = c+dc;
      while(mtCkInBounds(rr,cc) && b[rr][cc]===null){ rr += dr; cc += dc; }
      if(!mtCkInBounds(rr,cc)) continue;
      if(b[rr][cc].color === piece.color) continue;
      const capR = rr, capC = cc;
      let landR = rr+dr, landC = cc+dc;
      while(mtCkInBounds(landR,landC) && b[landR][landC]===null){
        out.push({toR:landR, toC:landC, capR, capC});
        landR += dr; landC += dc;
      }
    }
  } else {
    // Men capture in ALL 4 diagonal directions -- forward AND backward -- one square jump
    // over an adjacent opponent piece onto the empty square immediately beyond it.
    for(const [dr,dc] of MT_CK_KING_DIRS){
      const capR = r+dr, capC = c+dc, toR = r+2*dr, toC = c+2*dc;
      if(mtCkInBounds(toR,toC) && b[toR][toC]===null && mtCkInBounds(capR,capC) && b[capR][capC] && b[capR][capC].color !== piece.color){
        out.push({toR,toC,capR,capC});
      }
    }
  }
  return out;
}
function mtCkCapturablePieces(b, color){
  const out = [];
  for(let r=0;r<MT_CK_SIZE;r++) for(let c=0;c<MT_CK_SIZE;c++){
    if(b[r][c] && b[r][c].color===color && mtCkGetCaptures(b,r,c).length) out.push({r,c});
  }
  return out;
}
function mtCkMovablePieces(b, color){
  const out = [];
  for(let r=0;r<MT_CK_SIZE;r++) for(let c=0;c<MT_CK_SIZE;c++){
    if(b[r][c] && b[r][c].color===color && mtCkGetSimpleMoves(b,r,c).length) out.push({r,c});
  }
  return out;
}
function mtCkMaybeKing(b, r, c){
  const piece = b[r][c];
  if(!piece || piece.king) return false;
  if((piece.color==='red' && r===0) || (piece.color==='black' && r===MT_CK_SIZE-1)){
    piece.king = true;
    return true;
  }
  return false;
}
function mtCkHasAnyMove(b, color){
  return mtCkCapturablePieces(b,color).length>0 || mtCkMovablePieces(b,color).length>0;
}
function mtMountCheckersGame(container){
  container.innerHTML = `
    <div class="mt-checkers-wrap">
      <canvas class="mt-embedded-canvas mt-checkers-canvas"></canvas>
      <div class="mt-embedded-hint" id="mtCheckersMsg">Your move (red). Tap a piece, then tap where to move.</div>
      <div class="mt-embedded-controls"><button class="mt-embedded-btn" data-checkers-reset>New game</button></div>
    </div>
  `;
  const canvas = container.querySelector('canvas');
  const ctx = canvas.getContext('2d');
  const msgEl = container.querySelector('#mtCheckersMsg');
  const resetBtn = container.querySelector('[data-checkers-reset]');
  let running = true;
  const dpr = Math.max(1, window.devicePixelRatio || 1);
  let boardPx = 0;

  let board, turn, selected, gameOver, aiThinking, aiTimer = null, aiCaptureQueue = null;

  function setMsg(t){ if(msgEl) msgEl.textContent = t; }
  function setupBoard(){
    board = mtCkInitBoard();
    turn = 'player'; selected = null; gameOver = false; aiThinking = false; aiCaptureQueue = null;
    setMsg('Your move (red). Tap a piece, then tap where to move.');
  }
  setupBoard();

  function resize(){
    const w = Math.min(container.clientWidth, 340);
    boardPx = w;
    canvas.style.width = w + 'px';
    canvas.style.height = w + 'px';
    canvas.width = Math.floor(w * dpr);
    canvas.height = Math.floor(w * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    draw();
  }

  function draw(){
    if(!running || !boardPx) return;
    const s = boardPx / MT_CK_SIZE;
    ctx.clearRect(0,0,boardPx,boardPx);
    for(let r=0;r<MT_CK_SIZE;r++) for(let c=0;c<MT_CK_SIZE;c++){
      ctx.fillStyle = (r+c)%2===0 ? '#EDE3D3' : '#7A5C3E';
      ctx.fillRect(c*s, r*s, s, s);
    }
    if(selected){
      ctx.fillStyle = 'rgba(182,178,53,0.55)';
      ctx.fillRect(selected.c*s, selected.r*s, s, s);
      const caps = mtCkGetCaptures(board, selected.r, selected.c);
      const moves = caps.length ? caps : mtCkGetSimpleMoves(board, selected.r, selected.c);
      ctx.fillStyle = 'rgba(90,143,78,0.55)';
      for(const m of moves) ctx.fillRect(m.toC*s, m.toR*s, s, s);
    }
    for(let r=0;r<MT_CK_SIZE;r++) for(let c=0;c<MT_CK_SIZE;c++){
      const piece = board[r][c];
      if(!piece) continue;
      const cx = c*s+s/2, cy = r*s+s/2, rad = s*0.36;
      ctx.beginPath(); ctx.arc(cx, cy, rad, 0, Math.PI*2);
      ctx.fillStyle = piece.color === 'red' ? '#A6342E' : '#2b2b2b';
      ctx.fill();
      ctx.lineWidth = 2; ctx.strokeStyle = 'rgba(255,255,255,0.35)'; ctx.stroke();
      if(piece.king){
        ctx.fillStyle = '#B6B235';
        ctx.font = Math.round(rad) + 'px sans-serif';
        ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
        ctx.fillText('\u2605', cx, cy+1);
      }
    }
  }

  function squareFromEvent(e){
    const rect = canvas.getBoundingClientRect();
    const p = e.changedTouches ? e.changedTouches[0] : e;
    const x = p.clientX - rect.left, y = p.clientY - rect.top;
    const s = boardPx / MT_CK_SIZE;
    const c = Math.floor(x/s), r = Math.floor(y/s);
    if(!mtCkInBounds(r,c)) return null;
    return {r,c};
  }

  function checkGameOver(){
    if(!mtCkHasAnyMove(board,'red')){ gameOver = true; setMsg('No moves left \u2014 computer wins. Tap New game to try again.'); mtShowResultPopup(container, 'LOUNGE WINS', 'lose'); return true; }
    if(!mtCkHasAnyMove(board,'black')){ gameOver = true; setMsg('No moves left for the computer \u2014 you win! Tap New game to play again.'); mtShowResultPopup(container, 'YOU WIN', 'win'); return true; }
    return false;
  }

  function tryPlayerMove(toR, toC){
    const caps = mtCkGetCaptures(board, selected.r, selected.c);
    const asCapture = caps.find(m => m.toR===toR && m.toC===toC);
    if(asCapture){
      board[toR][toC] = board[selected.r][selected.c];
      board[selected.r][selected.c] = null;
      board[asCapture.capR][asCapture.capC] = null;
      const kinged = mtCkMaybeKing(board, toR, toC);
      const more = !kinged && mtCkGetCaptures(board, toR, toC).length > 0;
      if(more){
        selected = {r:toR, c:toC};
        setMsg('Capture again with the same piece.');
        draw();
        return;
      }
      selected = null;
      endPlayerTurn();
      return;
    }
    const mandatory = mtCkCapturablePieces(board,'red').length>0;
    if(mandatory){ setMsg('A capture is available \u2014 you must take it.'); draw(); return; }
    const moves = mtCkGetSimpleMoves(board, selected.r, selected.c);
    const asMove = moves.find(m => m.toR===toR && m.toC===toC);
    if(asMove){
      board[toR][toC] = board[selected.r][selected.c];
      board[selected.r][selected.c] = null;
      mtCkMaybeKing(board, toR, toC);
      selected = null;
      endPlayerTurn();
    }
  }

  function endPlayerTurn(){
    draw();
    if(checkGameOver()) return;
    turn = 'ai';
    aiThinking = true;
    setMsg('Computer is thinking...');
    aiTimer = setTimeout(runAiTurn, 500);
  }

  function handlePointer(e){
    if(gameOver || turn !== 'player' || aiThinking) return;
    const sq = squareFromEvent(e);
    if(!sq) return;
    const piece = board[sq.r][sq.c];
    if(selected){
      if(selected.r===sq.r && selected.c===sq.c) return;
      if(piece && piece.color==='red'){
        selected = {r:sq.r, c:sq.c};
        draw();
        return;
      }
      tryPlayerMove(sq.r, sq.c);
      return;
    }
    if(piece && piece.color==='red'){
      const mandatory = mtCkCapturablePieces(board,'red');
      if(mandatory.length && !mandatory.some(m => m.r===sq.r && m.c===sq.c)){
        setMsg('A different piece must capture \u2014 tap it instead.');
        return;
      }
      selected = {r:sq.r, c:sq.c};
      draw();
    }
  }
  canvas.addEventListener('pointerdown', handlePointer);

  // ---- Checkers AI, difficulty pass -----------------------------------------------
  // Old behavior (too easy, per direct feedback): when multiple pieces could capture, it
  // picked one at random rather than comparing them, and each individual jump in a chain
  // was scored 1 ply at a time with only a single-square danger check. That's why it would
  // routinely hand over multi-jump chains and walk into recaptures. Fixed by: (1) fully
  // enumerating every complete capture SEQUENCE (not just the next single jump) for every
  // capturing piece and picking the sequence with the most total value, with a secondary
  // penalty for what it leaves exposed afterward; (2) scoring quiet moves by simulating the
  // resulting position and checking the single biggest capture chain the player could then
  // play, instead of a shallow "is this one square unsafe" check. Still deliberately not a
  // full minimax search -- per the brief, harder but still beatable.
  function mtCkPieceValue(piece){ return piece.king ? 1.75 : 1; }

  // Every complete capture sequence available starting from (r,c): [{path, value}], where
  // path is the ordered list of jumps and value is total captured-piece worth (kings count
  // more). Recurses through mandatory continuation jumps exactly like a real turn, but
  // branches at every choice point instead of greedily taking the first option, so full
  // chains can be compared against each other.
  function mtCkAllCaptureSequences(board, r, c){
    function recurse(b, rr, cc, path, valueSoFar){
      const caps = mtCkGetCaptures(b, rr, cc);
      if(!caps.length) return [{path, value: valueSoFar}];
      let out = [];
      for(const m of caps){
        const nb = mtCkCloneBoard(b);
        const capturedPiece = nb[m.capR][m.capC];
        nb[m.toR][m.toC] = nb[rr][cc];
        nb[rr][cc] = null;
        nb[m.capR][m.capC] = null;
        const kingedNow = mtCkMaybeKing(nb, m.toR, m.toC);
        const val = valueSoFar + mtCkPieceValue(capturedPiece);
        const newPath = [...path, m];
        if(kingedNow){
          // Kinging mid-chain ends the capture turn immediately (matches live rule).
          out.push({path: newPath, value: val});
        } else {
          out = out.concat(recurse(nb, m.toR, m.toC, newPath, val));
        }
      }
      return out;
    }
    return recurse(board, r, c, [], 0);
  }
  // Biggest single capture-sequence value `color` could play on board `b` right now --
  // used to measure how exposed a candidate position leaves the mover.
  function mtCkBestCaptureValue(b, color){
    let best = 0;
    for(const p of mtCkCapturablePieces(b, color)){
      for(const s of mtCkAllCaptureSequences(b, p.r, p.c)) if(s.value > best) best = s.value;
    }
    return best;
  }
  function mtCkScoreQuietMove(b, p, m){
    const nb = mtCkCloneBoard(b);
    nb[m.toR][m.toC] = nb[p.r][p.c];
    nb[p.r][p.c] = null;
    const kinged = mtCkMaybeKing(nb, m.toR, m.toC);
    let score = 0;
    if(kinged) score += 6;
    else if(!nb[m.toR][m.toC].king) score += m.toR * 0.15; // black advances toward row 7
    score += (3.5 - Math.abs(m.toC - 3.5)) * 0.15; // mild center preference
    score -= mtCkBestCaptureValue(nb, 'red') * 4; // heavily punish handing over a capture
    score += Math.random() * 0.4; // small tie-break jitter, not the deciding factor anymore
    return score;
  }
  function runAiTurn(){
    if(!running || gameOver) return;
    const capturable = mtCkCapturablePieces(board, 'black');
    if(capturable.length){
      let best = null, bestScore = -Infinity;
      for(const piece of capturable){
        for(const s of mtCkAllCaptureSequences(board, piece.r, piece.c)){
          const nb = mtCkCloneBoard(board);
          let rr = piece.r, cc = piece.c;
          for(const mv of s.path){
            nb[mv.toR][mv.toC] = nb[rr][cc];
            nb[rr][cc] = null;
            nb[mv.capR][mv.capC] = null;
            mtCkMaybeKing(nb, mv.toR, mv.toC);
            rr = mv.toR; cc = mv.toC;
          }
          const exposure = mtCkBestCaptureValue(nb, 'red');
          const score = s.value * 10 - exposure * 3 + Math.random() * 0.3;
          if(score > bestScore){ bestScore = score; best = {r: piece.r, c: piece.c, path: s.path}; }
        }
      }
      aiCaptureQueue = { r: best.r, c: best.c, path: best.path, idx: 0 };
      stepCaptureQueue();
      return;
    }
    const movable = mtCkMovablePieces(board, 'black');
    if(!movable.length){ checkGameOver(); return; }
    let best = null, bestScore = -Infinity;
    for(const p of movable){
      for(const m of mtCkGetSimpleMoves(board, p.r, p.c)){
        const score = mtCkScoreQuietMove(board, p, m);
        if(score > bestScore){ bestScore = score; best = {p, m}; }
      }
    }
    board[best.m.toR][best.m.toC] = board[best.p.r][best.p.c];
    board[best.p.r][best.p.c] = null;
    mtCkMaybeKing(board, best.m.toR, best.m.toC);
    finishAiTurn();
  }
  // Steps through the precomputed best capture sequence one jump at a time (same 400ms
  // pacing as before) so the animation is unchanged -- only the decision-making moved
  // upfront into runAiTurn.
  function stepCaptureQueue(){
    const q = aiCaptureQueue;
    const move = q.path[q.idx];
    board[move.toR][move.toC] = board[q.r][q.c];
    board[q.r][q.c] = null;
    board[move.capR][move.capC] = null;
    mtCkMaybeKing(board, move.toR, move.toC);
    q.r = move.toR; q.c = move.toC; q.idx++;
    draw();
    if(q.idx < q.path.length){
      aiTimer = setTimeout(stepCaptureQueue, 400);
    } else {
      aiCaptureQueue = null;
      finishAiTurn();
    }
  }
  function finishAiTurn(){
    draw();
    aiThinking = false;
    if(checkGameOver()) return;
    turn = 'player';
    setMsg('Your move (red).');
  }

  function onReset(){ const p = container.querySelector('.mt-result-overlay'); if(p) p.remove(); setupBoard(); resize(); }
  resetBtn.addEventListener('click', onReset);
  window.addEventListener('resize', resize);
  resize();

  return function cleanup(){
    running = false;
    if(aiTimer) clearTimeout(aiTimer);
    window.removeEventListener('resize', resize);
    canvas.removeEventListener('pointerdown', handlePointer);
    resetBtn.removeEventListener('click', onReset);
  };
}

// ============ Chess: pure rules engine ============
// Simplifications, stated up front rather than hidden: no draw by repetition, no 50-move
// rule, and promotion always goes to a queen (no under-promotion picker in the UI). Every
// other standard rule is implemented: legal move generation, check, checkmate, stalemate,
// castling (both sides, with all the usual attacked-square/blocked-square/rights checks),
// en passant, and pawn double-step.
const CH_SIZE = 8;
function chInBounds(r,c){ return r>=0 && r<CH_SIZE && c>=0 && c<CH_SIZE; }
function chCloneBoard(b){ return b.map(row => row.map(cell => cell ? {type:cell.type, color:cell.color} : null)); }
function chCloneState(s){
  return { castling: {...s.castling}, enPassant: s.enPassant ? {...s.enPassant} : null };
}
function chInitBoard(){
  const b = Array.from({length:8}, () => Array(8).fill(null));
  const backRank = ['r','n','b','q','k','b','n','r'];
  for(let c=0;c<8;c++){
    b[0][c] = {type:backRank[c], color:'black'};
    b[1][c] = {type:'p', color:'black'};
    b[6][c] = {type:'p', color:'white'};
    b[7][c] = {type:backRank[c], color:'white'};
  }
  return b;
}
function chInitState(){
  return { castling: {wK:true, wQ:true, bK:true, bQ:true}, enPassant: null };
}

// ---- Pseudo-legal move generation per piece (does not yet check own-king safety) ----
function chPawnMoves(b, r, c, state){
  const piece = b[r][c];
  const dir = piece.color === 'white' ? -1 : 1;
  const startRow = piece.color === 'white' ? 6 : 1;
  const promoRow = piece.color === 'white' ? 0 : 7;
  const out = [];
  // forward one
  if(chInBounds(r+dir, c) && b[r+dir][c] === null){
    out.push({toR:r+dir, toC:c, promotion: (r+dir===promoRow)});
    // forward two from start row, only if both squares clear
    if(r === startRow && b[r+2*dir][c] === null){
      out.push({toR:r+2*dir, toC:c, doubleStep:true});
    }
  }
  // diagonal captures
  for(const dc of [-1,1]){
    const toR = r+dir, toC = c+dc;
    if(!chInBounds(toR,toC)) continue;
    const target = b[toR][toC];
    if(target && target.color !== piece.color){
      out.push({toR, toC, capture:true, promotion:(toR===promoRow)});
    } else if(state.enPassant && state.enPassant.r === toR && state.enPassant.c === toC){
      out.push({toR, toC, capture:true, enPassant:true});
    }
  }
  return out;
}
const CH_KNIGHT_OFFSETS = [[-2,-1],[-2,1],[-1,-2],[-1,2],[1,-2],[1,2],[2,-1],[2,1]];
function chKnightMoves(b, r, c){
  const piece = b[r][c];
  const out = [];
  for(const [dr,dc] of CH_KNIGHT_OFFSETS){
    const toR=r+dr, toC=c+dc;
    if(!chInBounds(toR,toC)) continue;
    const target = b[toR][toC];
    if(!target || target.color !== piece.color) out.push({toR,toC,capture:!!target});
  }
  return out;
}
const CH_DIAG_DIRS = [[-1,-1],[-1,1],[1,-1],[1,1]];
const CH_ORTHO_DIRS = [[-1,0],[1,0],[0,-1],[0,1]];
function chSlideMoves(b, r, c, dirs){
  const piece = b[r][c];
  const out = [];
  for(const [dr,dc] of dirs){
    let rr=r+dr, cc=c+dc;
    while(chInBounds(rr,cc)){
      const target = b[rr][cc];
      if(!target){ out.push({toR:rr,toC:cc}); }
      else { if(target.color !== piece.color) out.push({toR:rr,toC:cc,capture:true}); break; }
      rr+=dr; cc+=dc;
    }
  }
  return out;
}
function chKingMoves(b, r, c, state){
  const piece = b[r][c];
  const out = [];
  for(const [dr,dc] of [...CH_DIAG_DIRS, ...CH_ORTHO_DIRS]){
    const toR=r+dr, toC=c+dc;
    if(!chInBounds(toR,toC)) continue;
    const target = b[toR][toC];
    if(!target || target.color !== piece.color) out.push({toR,toC,capture:!!target});
  }
  // Castling -- rights not yet lost, king not currently in check, squares between clear,
  // and (checked by the caller, chLegalMoves) the king does not pass through or land on
  // an attacked square.
  const homeRow = piece.color === 'white' ? 7 : 0;
  if(r === homeRow && c === 4){
    const kRight = piece.color === 'white' ? state.castling.wK : state.castling.bK;
    const qRight = piece.color === 'white' ? state.castling.wQ : state.castling.bQ;
    if(kRight && b[homeRow][5]===null && b[homeRow][6]===null && b[homeRow][7] && b[homeRow][7].type==='r' && b[homeRow][7].color===piece.color){
      out.push({toR:homeRow, toC:6, castle:'king'});
    }
    if(qRight && b[homeRow][3]===null && b[homeRow][2]===null && b[homeRow][1]===null && b[homeRow][0] && b[homeRow][0].type==='r' && b[homeRow][0].color===piece.color){
      out.push({toR:homeRow, toC:2, castle:'queen'});
    }
  }
  return out;
}
function chPseudoMoves(b, r, c, state){
  const piece = b[r][c];
  if(!piece) return [];
  switch(piece.type){
    case 'p': return chPawnMoves(b,r,c,state);
    case 'n': return chKnightMoves(b,r,c);
    case 'b': return chSlideMoves(b,r,c,CH_DIAG_DIRS);
    case 'r': return chSlideMoves(b,r,c,CH_ORTHO_DIRS);
    case 'q': return chSlideMoves(b,r,c,[...CH_DIAG_DIRS, ...CH_ORTHO_DIRS]);
    case 'k': return chKingMoves(b,r,c,state);
    default: return [];
  }
}

function chFindKing(b, color){
  for(let r=0;r<8;r++) for(let c=0;c<8;c++) if(b[r][c] && b[r][c].type==='k' && b[r][c].color===color) return {r,c};
  return null;
}
// Is (r,c) attacked by any piece of `byColor`? Used for check detection AND for verifying
// castling doesn't move the king through or into check.
function chIsSquareAttacked(b, r, c, byColor){
  for(let rr=0; rr<8; rr++) for(let cc=0; cc<8; cc++){
    const piece = b[rr][cc];
    if(!piece || piece.color !== byColor) continue;
    if(piece.type === 'p'){
      const dir = piece.color === 'white' ? -1 : 1;
      if(rr+dir===r && (cc-1===c || cc+1===c)) return true;
    } else if(piece.type === 'n'){
      for(const [dr,dc] of CH_KNIGHT_OFFSETS) if(rr+dr===r && cc+dc===c) return true;
    } else if(piece.type === 'k'){
      for(const [dr,dc] of [...CH_DIAG_DIRS, ...CH_ORTHO_DIRS]) if(rr+dr===r && cc+dc===c) return true;
    } else {
      const dirs = piece.type==='b' ? CH_DIAG_DIRS : piece.type==='r' ? CH_ORTHO_DIRS : [...CH_DIAG_DIRS, ...CH_ORTHO_DIRS];
      for(const [dr,dc] of dirs){
        let x=rr+dr, y=cc+dc;
        while(chInBounds(x,y)){
          if(x===r && y===c) return true;
          if(b[x][y]) break;
          x+=dr; y+=dc;
        }
      }
    }
  }
  return false;
}
function chIsInCheck(b, color){
  const k = chFindKing(b, color);
  if(!k) return false;
  return chIsSquareAttacked(b, k.r, k.c, color==='white'?'black':'white');
}

// Applies a move (already known pseudo-legal) to a board+state, mutating copies, handling
// en passant capture removal, castling rook relocation, promotion (always to queen), and
// updating castling rights / the en-passant target square for the NEXT move.
function chApplyMove(board, state, r, c, move){
  const newBoard = chCloneBoard(board);
  const newState = chCloneState(state);
  const piece = newBoard[r][c];
  newState.enPassant = null;

  if(move.enPassant){
    newBoard[move.toR][move.toC] = piece;
    newBoard[r][c] = null;
    newBoard[r][move.toC] = null; // the captured pawn sits beside the mover, not on the landing square
  } else if(move.castle){
    newBoard[move.toR][move.toC] = piece;
    newBoard[r][c] = null;
    if(move.castle === 'king'){
      newBoard[r][5] = newBoard[r][7]; newBoard[r][7] = null;
    } else {
      newBoard[r][3] = newBoard[r][0]; newBoard[r][0] = null;
    }
  } else {
    newBoard[move.toR][move.toC] = piece;
    newBoard[r][c] = null;
    if(move.promotion) newBoard[move.toR][move.toC] = {type:'q', color:piece.color};
  }

  if(piece.type === 'p' && move.doubleStep){
    newState.enPassant = { r: (r+move.toR)/2, c };
  }
  if(piece.type === 'k'){
    if(piece.color==='white'){ newState.castling.wK=false; newState.castling.wQ=false; }
    else { newState.castling.bK=false; newState.castling.bQ=false; }
  }
  if(piece.type === 'r'){
    if(r===7 && c===0) newState.castling.wQ = false;
    if(r===7 && c===7) newState.castling.wK = false;
    if(r===0 && c===0) newState.castling.bQ = false;
    if(r===0 && c===7) newState.castling.bK = false;
  }
  // A rook captured on its home square also permanently forfeits that side's castling right.
  if(move.toR===7 && move.toC===0) newState.castling.wQ = false;
  if(move.toR===7 && move.toC===7) newState.castling.wK = false;
  if(move.toR===0 && move.toC===0) newState.castling.bQ = false;
  if(move.toR===0 && move.toC===7) newState.castling.bK = false;

  return { board: newBoard, state: newState };
}

// Full legal move list for one piece: pseudo-legal moves, minus any that would leave the
// mover's own king in check, minus castling moves that pass through or land on an
// attacked square (castling OUT of check, or castling THROUGH check, is illegal even
// though chKingMoves doesn't know that yet).
function chLegalMovesForPiece(board, state, r, c){
  const piece = board[r][c];
  if(!piece) return [];
  const pseudo = chPseudoMoves(board, r, c, state);
  const opp = piece.color === 'white' ? 'black' : 'white';
  return pseudo.filter(m => {
    if(m.castle){
      const homeRow = r;
      if(chIsSquareAttacked(board, homeRow, 4, opp)) return false; // can't castle out of check
      const passThroughCol = m.castle==='king' ? 5 : 3;
      if(chIsSquareAttacked(board, homeRow, passThroughCol, opp)) return false; // can't pass through check
      if(chIsSquareAttacked(board, m.toR, m.toC, opp)) return false; // can't land in check
    }
    const { board: nb } = chApplyMove(board, state, r, c, m);
    return !chIsInCheck(nb, piece.color);
  });
}
function chAllLegalMoves(board, state, color){
  const out = [];
  for(let r=0;r<8;r++) for(let c=0;c<8;c++){
    if(board[r][c] && board[r][c].color === color){
      for(const m of chLegalMovesForPiece(board, state, r, c)) out.push({fromR:r, fromC:c, ...m});
    }
  }
  return out;
}
// 'checkmate' | 'stalemate' | 'check' | 'ongoing'
function chGameStatus(board, state, color){
  const moves = chAllLegalMoves(board, state, color);
  const inCheck = chIsInCheck(board, color);
  if(moves.length === 0) return inCheck ? 'checkmate' : 'stalemate';
  return inCheck ? 'check' : 'ongoing';
}
const CH_PIECE_VALUE = { p:1, n:3, b:3, r:5, q:9, k:0 };
function chMaterial(board, color){
  let sum = 0;
  for(let r=0;r<8;r++) for(let c=0;c<8;c++){
    const p = board[r][c];
    if(p && p.color===color) sum += CH_PIECE_VALUE[p.type];
  }
  return sum;
}

// ---- Simple AI: prioritizes immediate checkmate, then material after a shallow 1-ply
// "what could they capture back" safety check, same spirit as the checkers AI. Not a full
// search engine -- deliberately simple, matches the brief. ----
function chPickAiMove(board, state, color){
  const moves = chAllLegalMoves(board, state, color);
  if(!moves.length) return null;
  const opp = color === 'white' ? 'black' : 'white';
  let best = null, bestScore = -Infinity;
  for(const m of moves){
    const res = chApplyMove(board, state, m.fromR, m.fromC, m);
    const nb = res.board, ns = res.state;
    const status = chGameStatus(nb, ns, opp);
    if(status === 'checkmate') return m;
    let score = chMaterial(nb, color) - chMaterial(nb, opp);
    let worstReply = 0;
    const replies = chAllLegalMoves(nb, ns, opp);
    for(const r2 of replies){
      if(r2.capture){
        const capturedPiece = nb[r2.toR][r2.toC];
        const val = capturedPiece ? CH_PIECE_VALUE[capturedPiece.type] : 1;
        if(val > worstReply) worstReply = val;
      }
    }
    score -= worstReply;
    score += Math.random()*0.5;
    if(score > bestScore){ bestScore = score; best = m; }
  }
  return best;
}

// ---- Forced-mate solver, used both to VERIFY the curated puzzle bank (at build/test
// time) and at runtime to validate whichever move the student actually plays (any correct
// move is accepted, not just one memorized line) and to power the Hint button. ----
function chCanMateIn(board, state, color, n){
  const opp = color === 'white' ? 'black' : 'white';
  const moves = chAllLegalMoves(board, state, color);
  for(const m of moves){
    const res = chApplyMove(board, state, m.fromR, m.fromC, m);
    const oppStatus = chGameStatus(res.board, res.state, opp);
    if(oppStatus === 'checkmate') return { ok:true, move:m };
    if(n === 1) continue;
    if(oppStatus === 'stalemate') continue;
    const oppMoves = chAllLegalMoves(res.board, res.state, opp);
    let allGood = true;
    for(const r of oppMoves){
      const res2 = chApplyMove(res.board, res.state, r.fromR, r.fromC, r);
      const sub = chCanMateIn(res2.board, res2.state, color, n-1);
      if(!sub.ok){ allGood = false; break; }
    }
    if(allGood) return { ok:true, move:m };
  }
  return { ok:false };
}
// Validates one SPECIFIC candidate move (whatever the student actually played) against
// the "still forces mate within n" requirement, rather than requiring an exact memorized
// line -- any move that keeps the mate forced is accepted.
function chMoveLeadsToForcedMate(board, state, color, n, move){
  const opp = color === 'white' ? 'black' : 'white';
  const res = chApplyMove(board, state, move.fromR, move.fromC, move);
  const oppStatus = chGameStatus(res.board, res.state, opp);
  if(oppStatus === 'checkmate') return true;
  if(n === 1) return false;
  if(oppStatus === 'stalemate') return false;
  const oppMoves = chAllLegalMoves(res.board, res.state, opp);
  for(const r of oppMoves){
    const res2 = chApplyMove(res.board, res.state, r.fromR, r.fromC, r);
    const sub = chCanMateIn(res2.board, res2.state, color, n-1);
    if(!sub.ok) return false;
  }
  return true;
}


// ---- Curated, solver-verified checkmate puzzles ----
// Every position below was verified against chCanMateIn (an exhaustive forced-mate search
// over the real rules engine, not hand-derived by inspection) before being included here --
// see the test suite. White is always the side to move and the side delivering mate.
function chPuzzleBoard(spec){
  const b = Array.from({length:8}, () => Array(8).fill(null));
  for(const [r,c,type,color] of spec) b[r][c] = {type, color};
  return b;
}

    { name:'Rook corner drive', spec:[[7,4,'k','white'],[6,3,'r','white'],[3,6,'r','white'],[0,0,'k','black']] },
    { name:'Rook and queen', spec:[[7,4,'k','white'],[5,1,'q','white'],[2,6,'r','white'],[1,7,'k','black'],[1,6,'p','black']] },

  ],

    { name:'Queen and rook, pawn wall', spec:[[7,4,'k','white'],[3,2,'q','white'],[6,0,'r','white'],[1,6,'k','black'],[2,5,'p','black'],[2,7,'p','black']] },
