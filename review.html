<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Review — Mr Eric's Lounge</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Nunito:wght@400;500;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root{
    --cream:#F3EADD;
    --card:#FBF5EA;
    --ink:#3D2A22;
    --ink-soft:#856F5C;
    --coral:#7A2E35;
    --coral-dark:#5C2530;
    --teal:#6B7A3D;
    --line:#E0CBA4;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--cream);
    color:var(--ink);
    font-family:'Nunito', sans-serif;
    min-height:100vh;
    padding:20px 16px 60px;
  }
  h1{
    font-family:'Baloo 2', sans-serif;
    font-weight:800;
    font-size:22px;
    margin:0 0 4px 0;
  }
  .sub{
    font-family:'Space Mono', monospace;
    font-size:12px;
    color:var(--ink-soft);
    margin-bottom:20px;
  }
  .login-box{
    max-width:340px;
    margin:60px auto 0;
    background:var(--card);
    border-radius:16px;
    padding:24px;
    box-shadow:0 2px 0 rgba(58,42,30,.08);
  }
  .login-box h1{ text-align:center; margin-bottom:18px; }
  input{
    width:100%;
    font-family:'Nunito', sans-serif;
    font-size:15px;
    padding:12px 14px;
    border-radius:10px;
    border:1px solid var(--line);
    background:#fff;
    color:var(--ink);
    margin-bottom:10px;
  }
  button{
    font-family:'Baloo 2', sans-serif;
    font-weight:700;
    font-size:15px;
    border:none;
    border-radius:10px;
    padding:12px 16px;
    cursor:pointer;
  }
  .btn-primary{
    width:100%;
    background:var(--coral);
    color:#fff;
  }
  .btn-primary:disabled{ opacity:.6; }
  .error-msg{
    color:var(--coral);
    font-size:13px;
    margin:-4px 0 10px;
    min-height:16px;
  }
  .topbar{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:14px;
  }
  .signout{
    font-family:'Space Mono', monospace;
    font-size:12px;
    color:var(--ink-soft);
    background:none;
    border:none;
    text-decoration:underline;
    padding:4px;
    cursor:pointer;
  }
  .empty-card{
    background:var(--card);
    border-radius:14px;
    padding:24px;
    text-align:center;
    color:var(--ink-soft);
    font-size:14px;
  }
  .pending-grid{
    display:grid;
    grid-template-columns:1fr;
    gap:16px;
  }
  .pending-item{
    background:var(--card);
    border-radius:14px;
    overflow:hidden;
    box-shadow:0 2px 0 rgba(58,42,30,.08);
  }
  .pending-item img{
    width:100%;
    display:block;
    max-height:420px;
    object-fit:contain;
    background:#000;
  }
  .pending-meta{
    padding:8px 12px 0;
    font-family:'Space Mono', monospace;
    font-size:11px;
    color:var(--ink-soft);
  }
  .pending-actions{
    display:flex;
    gap:8px;
    padding:12px;
  }
  .pending-actions button{ flex:1; }
  .btn-approve{ background:var(--teal); color:#fff; }
  .btn-reject{ background:var(--coral-dark); color:#fff; }
  .pending-actions button:disabled{ opacity:.5; }
  .hidden{ display:none !important; }
  .loading-text{
    font-family:'Space Mono', monospace;
    font-size:13px;
    color:var(--ink-soft);
    text-align:center;
    padding:40px 0;
  }
  .tab-row{
    display:flex;
    gap:8px;
    margin-bottom:18px;
  }
  .tab-btn{
    flex:1;
    background:var(--card);
    color:var(--ink-soft);
    border:1px solid var(--line);
    border-radius:999px;
    padding:10px;
    font-family:'Nunito', sans-serif;
    font-weight:700;
    font-size:14px;
  }
  .tab-btn.active{
    background:var(--coral);
    color:#fff;
    border-color:var(--coral);
  }
  .subtab-row{
    display:flex;
    gap:8px;
    margin-bottom:16px;
  }
  .subtab-btn{
    background:none;
    border:none;
    color:var(--ink-soft);
    font-family:'Nunito', sans-serif;
    font-weight:700;
    font-size:13px;
    padding:6px 4px;
    border-bottom:2px solid transparent;
    border-radius:0;
  }
  .subtab-btn.active{
    color:var(--ink);
    border-bottom-color:var(--coral);
  }
  .question-item{
    background:var(--card);
    border-radius:14px;
    padding:16px;
    margin-bottom:12px;
    box-shadow:0 2px 0 rgba(58,42,30,.08);
  }
  .question-name{
    font-family:'Baloo 2', sans-serif;
    font-weight:700;
    font-size:14px;
    color:var(--coral);
    margin-bottom:4px;
  }
  .question-body{
    font-size:15px;
    line-height:1.5;
    white-space:pre-wrap;
    word-break:break-word;
  }
  .question-meta{
    font-family:'Space Mono', monospace;
    font-size:11px;
    color:var(--ink-soft);
    margin-top:10px;
  }
  .question-actions{
    margin-top:12px;
  }
  .btn-mark-read{
    background:var(--teal);
    color:#fff;
    width:100%;
  }
  .btn-mark-read:disabled{ opacity:.5; }
  .answer-textarea{
    width:100%;
    box-sizing:border-box;
    font-family:'Nunito', sans-serif;
    font-size:14px;
    color:var(--ink);
    background:#fff;
    border:1px solid var(--line);
    border-radius:10px;
    padding:10px 12px;
    min-height:80px;
    resize:vertical;
    margin-top:10px;
  }
  .btn-save-answer{
    background:var(--coral);
    color:#fff;
    width:100%;
    margin-top:8px;
  }
  .btn-save-answer:disabled{ opacity:.5; }
  .answer-block{
    margin-top:10px;
    padding-top:10px;
    border-top:1px dashed var(--line);
  }
  .answer-label{
    font-family:'Baloo 2', sans-serif;
    font-weight:700;
    font-size:13px;
    color:var(--teal);
    margin-bottom:4px;
  }
  .answer-text{
    font-size:14px;
    line-height:1.5;
    white-space:pre-wrap;
    word-break:break-word;
  }
  .pevent-item{
    background:var(--card);
    border-radius:14px;
    padding:16px;
    margin-bottom:12px;
    box-shadow:0 2px 0 rgba(58,42,30,.08);
  }
  .pevent-title{
    font-family:'Baloo 2', sans-serif;
    font-weight:700;
    font-size:15px;
    margin-bottom:4px;
  }
  .pevent-org{
    display:inline-block;
    font-size:10px;
    font-weight:800;
    text-transform:uppercase;
    letter-spacing:.04em;
    background:var(--teal);
    color:#fff;
    padding:2px 8px;
    border-radius:999px;
    margin-bottom:8px;
  }
  .pevent-desc{
    font-size:13px;
    line-height:1.5;
    margin-bottom:8px;
  }
  .pevent-meta{
    font-family:'Space Mono', monospace;
    font-size:11px;
    color:var(--ink-soft);
    margin-bottom:4px;
  }
  .pevent-link{
    font-size:12px;
    color:var(--coral);
    word-break:break-all;
    display:block;
    margin-bottom:10px;
  }
  .pevent-actions{
    display:flex;
    gap:8px;
  }
  .pevent-actions button{ flex:1; }
  .pevent-actions button:disabled{ opacity:.5; }
</style>
</head>
<body>

<div id="loginScreen" class="login-box">
  <h1>Review</h1>
  <input type="email" id="loginEmail" placeholder="Email" autocomplete="username">
  <input type="password" id="loginPassword" placeholder="Password" autocomplete="current-password">
  <div class="error-msg" id="loginError"></div>
  <button class="btn-primary" id="loginBtn">Sign in</button>
</div>

<div id="reviewScreen" class="hidden">
  <div class="topbar">
    <div>
      <h1>Review</h1>
      <div class="sub" id="headerCount">Loading…</div>
    </div>
    <button class="signout" id="signOutBtn">Sign out</button>
  </div>

  <div class="tab-row">
    <button class="tab-btn active" id="tabPhotosBtn" data-tab="photos">📷 Photos</button>
    <button class="tab-btn" id="tabQuestionsBtn" data-tab="questions">💬 Questions</button>
    <button class="tab-btn" id="tabEventsBtn" data-tab="events">🌐 Events</button>
  </div>

  <div id="photosPanel">
    <div id="pendingContainer"><div class="loading-text">Loading pending photos…</div></div>
  </div>

  <div id="questionsPanel" class="hidden">
    <div class="subtab-row">
      <button class="subtab-btn active" id="subtabUnreadBtn" data-subtab="unread">Unread</button>
      <button class="subtab-btn" id="subtabArchiveBtn" data-subtab="archive">Archive</button>
    </div>
    <div id="questionsContainer"><div class="loading-text">Loading questions…</div></div>
  </div>

  <div id="eventsPanel" class="hidden">
    <p style="font-size:12px; color:var(--ink-soft); margin:0 0 14px;">Found by the daily scraper, not yet on the site. Approve to publish, reject to discard.</p>
    <div id="pendingEventsContainer"><div class="loading-text">Loading candidate events…</div></div>
  </div>
</div>

<script>
const SUPABASE_URL = "https://uugjyucgeyopyvmhckdg.supabase.co";
const SUPABASE_ANON_KEY = "sb_publishable_F-idKUOOIWIpm7sMRtR-mA_m5Zir3Na";
const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
const BUCKET = "Photos";

const loginScreen = document.getElementById('loginScreen');
const reviewScreen = document.getElementById('reviewScreen');
const loginBtn = document.getElementById('loginBtn');
const loginError = document.getElementById('loginError');
const pendingContainer = document.getElementById('pendingContainer');
const questionsContainer = document.getElementById('questionsContainer');
const pendingEventsContainer = document.getElementById('pendingEventsContainer');
const headerCount = document.getElementById('headerCount');
const photosPanel = document.getElementById('photosPanel');
const questionsPanel = document.getElementById('questionsPanel');
const eventsPanel = document.getElementById('eventsPanel');

let activeTab = 'photos';
let activeQuestionsSubtab = 'unread';

function escapeHtml(s){
  const d = document.createElement('div');
  d.textContent = s == null ? '' : String(s);
  return d.innerHTML;
}

// Same conversion as index.html's virtualEventCardHtml -- shows Tashkent time here too,
// so review decisions are made against the real local time, not a raw ET/EDT/PT string.
const TZ_OFFSETS_FROM_UTC = {
  ET:-4, EDT:-4, EST:-5, EASTERN:-4,
  CT:-5, CDT:-5, CST:-6, CENTRAL:-5,
  MT:-6, MDT:-6, MST:-7, MOUNTAIN:-6,
  PT:-7, PDT:-7, PST:-8, PACIFIC:-7,
  UTC:0, GMT:0,
};
function timeTextToTashkent(startDate, timeText){
  if(!startDate || !timeText) return null;
  const m = timeText.match(/(\d{1,2}):?(\d{2})?\s*([AaPp])\.?[Mm]\.?\s*(ET|EDT|EST|Eastern|CT|CDT|CST|Central|MT|MDT|MST|Mountain|PT|PDT|PST|Pacific|UTC|GMT)\b/);
  if(!m) return null;
  const offset = TZ_OFFSETS_FROM_UTC[m[4].toUpperCase()];
  if(offset === undefined) return null;
  let hour = parseInt(m[1], 10) % 12;
  if(m[3].toUpperCase() === 'P') hour += 12;
  const minute = m[2] ? parseInt(m[2], 10) : 0;
  const dateParts = startDate.split('-').map(Number);
  if(dateParts.length !== 3) return null;
  const [year, month, day] = dateParts;
  const utcMs = Date.UTC(year, month - 1, day, hour - offset, minute);
  const tashkentMs = utcMs + 5 * 60 * 60 * 1000;
  const d = new Date(tashkentMs);
  const months = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  return `${String(d.getUTCDate()).padStart(2,'0')} ${months[d.getUTCMonth()]}, ${String(d.getUTCHours()).padStart(2,'0')}:${String(d.getUTCMinutes()).padStart(2,'0')}`;
}

async function checkSession(){
  const { data } = await sb.auth.getSession();
  if(data.session){
    showReview();
  } else {
    showLogin();
  }
}

function showLogin(){
  loginScreen.classList.remove('hidden');
  reviewScreen.classList.add('hidden');
}
function showReview(){
  loginScreen.classList.add('hidden');
  reviewScreen.classList.remove('hidden');
  loadActivePanel();
}

loginBtn.addEventListener('click', async ()=>{
  const email = document.getElementById('loginEmail').value.trim();
  const password = document.getElementById('loginPassword').value;
  loginError.textContent = '';
  loginBtn.disabled = true;
  loginBtn.textContent = 'Signing in…';
  const { error } = await sb.auth.signInWithPassword({ email, password });
  loginBtn.disabled = false;
  loginBtn.textContent = 'Sign in';
  if(error){
    loginError.textContent = 'Wrong email or password.';
    return;
  }
  showReview();
});

document.getElementById('signOutBtn').addEventListener('click', async ()=>{
  await sb.auth.signOut();
  showLogin();
});

document.getElementById('tabPhotosBtn').addEventListener('click', ()=> switchTab('photos'));
document.getElementById('tabQuestionsBtn').addEventListener('click', ()=> switchTab('questions'));
document.getElementById('tabEventsBtn').addEventListener('click', ()=> switchTab('events'));
document.getElementById('subtabUnreadBtn').addEventListener('click', ()=> switchQuestionsSubtab('unread'));
document.getElementById('subtabArchiveBtn').addEventListener('click', ()=> switchQuestionsSubtab('archive'));

function switchTab(tab){
  activeTab = tab;
  document.getElementById('tabPhotosBtn').classList.toggle('active', tab === 'photos');
  document.getElementById('tabQuestionsBtn').classList.toggle('active', tab === 'questions');
  document.getElementById('tabEventsBtn').classList.toggle('active', tab === 'events');
  photosPanel.classList.toggle('hidden', tab !== 'photos');
  questionsPanel.classList.toggle('hidden', tab !== 'questions');
  eventsPanel.classList.toggle('hidden', tab !== 'events');
  loadActivePanel();
}
function switchQuestionsSubtab(subtab){
  activeQuestionsSubtab = subtab;
  document.getElementById('subtabUnreadBtn').classList.toggle('active', subtab === 'unread');
  document.getElementById('subtabArchiveBtn').classList.toggle('active', subtab === 'archive');
  loadQuestions();
}
function loadActivePanel(){
  if(activeTab === 'photos') loadPending();
  else if(activeTab === 'questions') loadQuestions();
  else loadPendingEvents();
}

async function loadPending(){
  pendingContainer.innerHTML = '<div class="loading-text">Loading pending photos…</div>';
  const { data: files, error } = await sb.storage.from(BUCKET).list('pending', {
    limit: 200,
    sortBy: { column: 'created_at', order: 'desc' }
  });
  if(error){
    pendingContainer.innerHTML = '<div class="empty-card">Couldn\'t load photos — check your connection and reload.</div>';
    headerCount.textContent = 'Error';
    return;
  }
  const realFiles = (files || []).filter(f => f.name && !f.name.startsWith('.'));
  headerCount.textContent = realFiles.length === 0
    ? 'Nothing waiting'
    : `${realFiles.length} photo${realFiles.length===1?'':'s'} waiting for review`;
  if(realFiles.length === 0){
    pendingContainer.innerHTML = '<div class="empty-card">No pending photos right now.</div>';
    return;
  }
  const items = await Promise.all(realFiles.map(async f=>{
    const path = 'pending/' + f.name;
    const { data: signed } = await sb.storage.from(BUCKET).createSignedUrl(path, 3600);
    const when = f.created_at ? new Date(f.created_at).toLocaleString() : '';
    return `
      <div class="pending-item" data-name="${escapeHtml(f.name)}">
        <img src="${signed ? signed.signedUrl : ''}" alt="Pending photo" loading="lazy">
        <div class="pending-meta">${escapeHtml(when)}</div>
        <div class="pending-actions">
          <button class="btn-approve" data-action="approve">Approve</button>
          <button class="btn-reject" data-action="reject">Reject</button>
        </div>
      </div>
    `;
  }));
  pendingContainer.innerHTML = `<div class="pending-grid">${items.join('')}</div>`;
  pendingContainer.querySelectorAll('.pending-item').forEach(el=>{
    const name = el.dataset.name;
    el.querySelectorAll('button').forEach(btn=>{
      btn.addEventListener('click', ()=> handlePhotoAction(name, btn.dataset.action, el));
    });
  });
}

async function handlePhotoAction(name, action, el){
  el.querySelectorAll('button').forEach(b=> b.disabled = true);
  const fromPath = 'pending/' + name;
  try{
    if(action === 'approve'){
      const toPath = 'approved/' + name;
      const { error } = await sb.storage.from(BUCKET).move(fromPath, toPath);
      if(error) throw error;
    } else {
      const { error } = await sb.storage.from(BUCKET).remove([fromPath]);
      if(error) throw error;
    }
    el.remove();
    const remaining = pendingContainer.querySelectorAll('.pending-item').length;
    headerCount.textContent = remaining === 0 ? 'Nothing waiting' : `${remaining} photo${remaining===1?'':'s'} waiting for review`;
    if(remaining === 0){
      pendingContainer.innerHTML = '<div class="empty-card">No pending photos right now.</div>';
    }
  }catch(e){
    el.querySelectorAll('button').forEach(b=> b.disabled = false);
    alert('Something went wrong — try again.');
  }
}

// Questions: anyone can INSERT (that's how the public "Have a question?" box on the main
// site works), but only this authenticated session can SELECT/UPDATE them -- same
// public-write/private-read split as the photo pending/approved folders, just on a table
// instead of storage. "Mark as read" sets is_read=true rather than deleting, so there's a
// real archive to look back through, not a one-shot inbox.
async function loadQuestions(){
  questionsContainer.innerHTML = '<div class="loading-text">Loading questions…</div>';
  const { data: rows, error } = await sb.from('questions')
    .select('*')
    .eq('is_read', activeQuestionsSubtab === 'archive')
    .order('created_at', { ascending: false })
    .limit(300);
  if(error){
    questionsContainer.innerHTML = '<div class="empty-card">Couldn\'t load questions — check your connection and reload.</div>';
    headerCount.textContent = 'Error';
    return;
  }
  if(activeTab === 'questions'){
    headerCount.textContent = rows.length === 0
      ? (activeQuestionsSubtab === 'unread' ? 'Nothing new' : 'Archive is empty')
      : `${rows.length} question${rows.length===1?'':'s'}${activeQuestionsSubtab === 'unread' ? ' waiting' : ' archived'}`;
  }
  if(rows.length === 0){
    questionsContainer.innerHTML = `<div class="empty-card">${activeQuestionsSubtab === 'unread' ? 'No new questions right now.' : 'No archived questions yet.'}</div>`;
    return;
  }
  // Every question gets a pre-filled answer box (empty if never answered, filled if it
  // was) with one Save/Update button -- publishing an answer sets is_read=true too, so
  // answering a question from the Unread tab is itself how it moves to Archive. There's
  // no separate "edit" toggle: the textarea IS the current answer, always editable.
  questionsContainer.innerHTML = rows.map(q => `
    <div class="question-item" data-id="${escapeHtml(q.id)}">
      <div class="question-name">${q.name ? escapeHtml(q.name) : 'Anonymous'}</div>
      <div class="question-body">${escapeHtml(q.body)}</div>
      <div class="question-meta">${q.created_at ? new Date(q.created_at).toLocaleString() : ''}</div>
      <textarea class="answer-textarea" data-role="answer-input" placeholder="Type your answer…">${q.answer ? escapeHtml(q.answer) : ''}</textarea>
      <button class="btn-save-answer" data-action="save-answer">${q.answer ? 'Update answer' : 'Save answer & publish'}</button>
      ${(activeQuestionsSubtab === 'unread' && !q.answer) ? `
        <div class="question-actions">
          <button class="btn-mark-read" data-action="mark-read">Mark as read (no answer)</button>
        </div>
      ` : ''}
    </div>
  `).join('');
  questionsContainer.querySelectorAll('.question-item').forEach(el=>{
    const markBtn = el.querySelector('[data-action="mark-read"]');
    if(markBtn) markBtn.addEventListener('click', ()=> handleMarkRead(el.dataset.id, el, markBtn));
    const saveBtn = el.querySelector('[data-action="save-answer"]');
    if(saveBtn) saveBtn.addEventListener('click', ()=> handleSaveAnswer(el.dataset.id, saveBtn));
  });
}

async function handleSaveAnswer(id, btn){
  const el = btn.closest('.question-item');
  const textarea = el.querySelector('[data-role="answer-input"]');
  const answer = textarea.value.trim();
  if(!answer){
    alert('Type an answer first.');
    return;
  }
  const originalLabel = btn.textContent;
  btn.disabled = true;
  btn.textContent = 'Saving…';
  try{
    const { error } = await sb.from('questions')
      .update({ answer, answered_at: new Date().toISOString(), is_read: true })
      .eq('id', id);
    if(error) throw error;
    // Publishing an answer always sets is_read=true, so if we were on the Unread tab
    // this question just moved to Archive -- reload so the list reflects that.
    if(activeQuestionsSubtab === 'unread'){
      await loadQuestions();
    } else {
      btn.disabled = false;
      btn.textContent = 'Update answer';
    }
  }catch(e){
    btn.disabled = false;
    btn.textContent = originalLabel;
    alert('Something went wrong — try again.');
  }
}

async function handleMarkRead(id, el, btn){
  btn.disabled = true;
  btn.textContent = 'Marking…';
  try{
    const { error } = await sb.from('questions').update({ is_read: true }).eq('id', id);
    if(error) throw error;
    el.remove();
    const remaining = questionsContainer.querySelectorAll('.question-item').length;
    headerCount.textContent = remaining === 0 ? 'Nothing new' : `${remaining} question${remaining===1?'':'s'} waiting`;
    if(remaining === 0){
      questionsContainer.innerHTML = '<div class="empty-card">No new questions right now.</div>';
    }
  }catch(e){
    btn.disabled = false;
    btn.textContent = 'Mark as read (no answer)';
    alert('Something went wrong — try again.');
  }
}

// Pending events: found by a daily scraper (service-role key, never exposed to any
// browser) checking a small set of trustworthy sources for free/educational/appropriate
// online events. Only an authenticated session can view or act on them -- there's no
// public insert policy on this table at all, since candidates are meant to come from the
// scraper alone, not from random visitors. Approve flips status to 'approved'; a separate
// scheduled workflow (not this page) picks those up, appends them to the live site's
// data/events-virtual.json, and clears them from this table. Reject deletes the row
// immediately -- it just disappears, nothing lingers.
async function loadPendingEvents(){
  pendingEventsContainer.innerHTML = '<div class="loading-text">Loading candidate events…</div>';
  const { data: rows, error } = await sb.from('pending_events')
    .select('*')
    .eq('status', 'pending')
    .order('start_date', { ascending: true })
    .limit(200);
  if(error){
    pendingEventsContainer.innerHTML = '<div class="empty-card">Couldn\'t load events — check your connection and reload.</div>';
    headerCount.textContent = 'Error';
    return;
  }
  if(activeTab === 'events'){
    headerCount.textContent = rows.length === 0 ? 'Nothing waiting' : `${rows.length} event${rows.length===1?'':'s'} waiting for review`;
  }
  if(rows.length === 0){
    pendingEventsContainer.innerHTML = '<div class="empty-card">No candidate events right now.</div>';
    return;
  }
  pendingEventsContainer.innerHTML = rows.map(e => `
    <div class="pevent-item" data-id="${escapeHtml(e.id)}">
      <div class="pevent-title">${escapeHtml(e.title)}</div>
      ${e.org ? `<div class="pevent-org">${escapeHtml(e.org)}</div>` : ''}
      ${e.description ? `<div class="pevent-desc">${escapeHtml(e.description)}</div>` : ''}
      <div class="pevent-meta">${escapeHtml(e.start_date)}${(() => { const t = timeTextToTashkent(e.start_date, e.time_text); return t ? ` · ${escapeHtml(t)} Tashkent` : (e.time_text ? ` · ${escapeHtml(e.time_text)} (couldn't confirm Tashkent time)` : ''); })()}${e.category ? ' · ' + escapeHtml(e.category) : ''}</div>
      <a class="pevent-link" href="${escapeHtml(e.url)}" target="_blank" rel="noopener">${escapeHtml(e.url)}</a>
      ${e.source ? `<div class="pevent-meta">Found via: ${escapeHtml(e.source)}</div>` : ''}
      <div class="pevent-actions" style="margin-top:10px;">
        <button class="btn-approve" data-action="approve">Approve</button>
        <button class="btn-reject" data-action="reject">Reject</button>
      </div>
    </div>
  `).join('');
  pendingEventsContainer.querySelectorAll('.pevent-item').forEach(el=>{
    const id = el.dataset.id;
    el.querySelectorAll('button').forEach(btn=>{
      btn.addEventListener('click', ()=> handlePendingEventAction(id, btn.dataset.action, el));
    });
  });
}

async function handlePendingEventAction(id, action, el){
  el.querySelectorAll('button').forEach(b=> b.disabled = true);
  try{
    if(action === 'approve'){
      const { error } = await sb.from('pending_events').update({ status: 'approved' }).eq('id', id);
      if(error) throw error;
    } else {
      const { error } = await sb.from('pending_events').delete().eq('id', id);
      if(error) throw error;
    }
    el.remove();
    const remaining = pendingEventsContainer.querySelectorAll('.pevent-item').length;
    headerCount.textContent = remaining === 0 ? 'Nothing waiting' : `${remaining} event${remaining===1?'':'s'} waiting for review`;
    if(remaining === 0){
      pendingEventsContainer.innerHTML = '<div class="empty-card">No candidate events right now.</div>';
    }
  }catch(e){
    el.querySelectorAll('button').forEach(b=> b.disabled = false);
    alert('Something went wrong — try again.');
  }
}

checkSession();
</script>
</body>
</html>
